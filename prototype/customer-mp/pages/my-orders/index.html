<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的订单</title>
<script src="../../js/sdk.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; display:flex; justify-content:center; height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.phone { width:375px; height:100vh; background:#f5f7fa; display:flex; flex-direction:column; position:relative; }
.nav-top { position:absolute; top:10px; right:10px; z-index:200; }
.nav-top a { font-size:12px; color:#666; text-decoration:none; background:rgba(255,255,255,.95); padding:6px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.page { flex:1; height:0; overflow-y:auto; scrollbar-width:none; }
.page::-webkit-scrollbar { display:none; }

/* Tabs */
.tab-bar { display:flex; background:#fff; border-bottom:1px solid #eee; position:sticky; top:0; z-index:10; }
.tab { flex:1; text-align:center; padding:14px 0; cursor:pointer; font-size:14px; color:#999; position:relative; transition:color .15s; }
.tab.active { color:#07c160; font-weight:600; }
.tab.active::after { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:24px; height:3px; background:#07c160; border-radius:2px; }

/* Order card */
.order-card { background:#fff; padding:16px; margin:0 0 10px; }
.order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.order-room { font-size:16px; font-weight:600; }
.order-status { font-size:12px; font-weight:600; padding:4px 10px; border-radius:12px; }
.status-inuse { background:#e8f5e9; color:#00a870; }
.status-booked { background:#f3e5f5; color:#9c27b0; }
.status-completed { background:#f5f5f5; color:#999; }
.order-time { font-size:13px; color:#666; margin-bottom:4px; }
.order-price { font-size:14px; font-weight:600; color:#e37318; margin-bottom:8px; }

/* Big action buttons */
.big-actions { display:flex; gap:10px; margin-top:10px; }
.big-action-btn { flex:1; padding:14px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; border:none; text-align:center; transition:opacity .15s; }
.big-action-btn:active { opacity:.8; }
.big-action-btn.primary { background:#07c160; color:#fff; }
.big-action-btn.outline { background:#fff; color:#07c160; border:1.5px solid #07c160; }
.big-action-btn.ghost { background:#f5f5f5; color:#666; }

.door-section { background:#fffbf0; padding:12px; display:flex; align-items:center; justify-content:space-between; margin:10px 0; }
.door-label { font-size:12px; color:#999; }
.door-code { font-size:20px; font-weight:800; font-family:"Courier New",monospace; color:#333; letter-spacing:6px; }
.door-hint { font-size:12px; color:#e37318; }
.empty { text-align:center; padding:60px 20px; color:#999; }
.empty-icon { font-size:48px; margin-bottom:12px; }
.cancel-note { font-size:11px; color:#999; margin-left:8px; }
.order-btn { padding:8px 16px; border-radius:8px; font-size:13px; cursor:pointer; border:none; font-weight:500; }
.order-btn.danger { background:#fff; color:#d54941; border:1.5px solid #d54941; }
.order-btn.outline { background:#fff; color:#07c160; border:1.5px solid #07c160; }
.order-btn.ghost { background:#f5f5f5; color:#666; }

/* Logistics */
.logistics-card { background:#f8f9fa; border-radius:10px; padding:12px; margin:10px 0; }
.logistics-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.logistics-carrier { font-size:13px; font-weight:600; color:#333; }
.logistics-carrier .carrier-icon { font-size:16px; margin-right:4px; }
.logistics-tracking { font-size:12px; color:#666; }
.logistics-tracking .tracking-num { color:#0052d9; cursor:pointer; }
.logistics-tracking .tracking-num:hover { text-decoration:underline; }
.logistics-status-row { display:flex; align-items:center; gap:6px; margin-top:6px; padding-top:6px; border-top:1px solid #eee; }
.ls-badge { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:600; }
.ls-badge.pending { background:#fff3e0; color:#e37318; }
.ls-badge.transit { background:#e3f2fd; color:#0052d9; }
.ls-badge.delivered { background:#e8f5e9; color:#00a870; }
.ls-progress { flex:1; display:flex; align-items:center; gap:2px; }
.ls-step { flex:1; text-align:center; position:relative; }
.ls-step-dot { width:8px; height:8px; border-radius:50%; display:inline-block; background:#ddd; }
.ls-step-dot.active { background:#07c160; }
.ls-step-dot.current { background:#0052d9; box-shadow:0 0 0 3px rgba(0,82,217,.2); }
.ls-step-label { font-size:9px; color:#bbb; margin-top:2px; display:block; }
.ls-step-label.active { color:#07c160; font-weight:600; }
.ls-step-label.current { color:#0052d9; font-weight:600; }
.ls-line { position:absolute; top:4px; right:-50%; width:100%; height:2px; background:#ddd; z-index:-1; }
.ls-line.active { background:#07c160; }
.ls-estimated { font-size:11px; color:#999; margin-top:4px; }
.logistics-btn { font-size:12px; color:#0052d9; background:none; border:none; cursor:pointer; font-weight:500; padding:2px 6px; }
.logistics-btn:active { opacity:.7; }

/* Logistics detail modal */
.lg-modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99;display:none;align-items:center;justify-content:center; }
.lg-modal { background:#fff;border-radius:14px;width:340px;max-height:85vh;overflow-y:auto; }
.lg-modal-header { position:sticky;top:0;background:#fff;padding:16px 16px 0;border-radius:14px 14px 0 0;z-index:1;display:flex;justify-content:space-between;align-items:center; }
.lg-modal-header h3 { font-size:16px; }
.lg-modal-close { font-size:20px;cursor:pointer;color:#999;padding:0 4px; }
.lg-track-info { padding:12px 16px;background:#f8f9fa;margin:8px 16px;border-radius:8px; }
.lg-track-info div { font-size:12px;color:#666;margin-bottom:2px; }
.lg-track-info .lg-carrier { font-size:14px;font-weight:600;color:#333; }
.lg-timeline { padding:16px; }
.lg-tl-item { display:flex; gap:12px; position:relative; padding-bottom:20px; }
.lg-tl-item:last-child { padding-bottom:0; }
.lg-tl-dot { width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:2px;position:relative;z-index:1; }
.lg-tl-dot.done { background:#07c160; }
.lg-tl-dot.current { background:#0052d9; box-shadow:0 0 0 4px rgba(0,82,217,.2); }
.lg-tl-dot.pending { background:#ddd; }
.lg-tl-line { position:absolute;left:5px;top:16px;width:2px;height:calc(100% - 4px);background:#eee; }
.lg-tl-line.done { background:#07c160; }
.lg-tl-content { flex:1; }
.lg-tl-desc { font-size:13px;color:#333; }
.lg-tl-desc.current { color:#0052d9; font-weight:600; }
.lg-tl-time { font-size:11px;color:#999;margin-top:2px; }

.toast { position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:100;display:none; }
.bottom-nav { display:flex; border-top:1px solid #eee; background:#fff; flex-shrink:0; }
.nav-item { flex:1; text-align:center; padding:10px 0 6px; cursor:pointer; color:#999; text-decoration:none; }
.nav-item .nav-icon { font-size:20px; display:block; }
.nav-item .nav-label { font-size:10px; margin-top:2px; }
.nav-item.active { color:#07c160; }
.modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99;display:none;align-items:center;justify-content:center; }
.modal { background:#fff;border-radius:14px;padding:20px;width:300px;text-align:center; }
.modal h3 { font-size:16px;margin-bottom:8px;color:#333; }
.modal p { font-size:13px;color:#666;margin-bottom:16px; }
.modal-buttons { display:flex;gap:10px; }
.modal-btn { flex:1;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600; }
.modal-btn.cancel { background:#f5f5f5;color:#666; }
.modal-btn.confirm { background:#07c160;color:#fff; }
.modal-btn.danger { background:#d54941;color:#fff; }
.time-picker { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
.time-option { padding:10px 8px; border-radius:8px; border:1.5px solid #e5e5e5; background:#fff; cursor:pointer; font-size:12px; text-align:center; transition:all .15s; }
.time-option:hover { border-color:#07c160; }
.time-option.selected { background:#07c160; color:#fff; border-color:#07c160; }
.time-option .ext-time { font-weight:600; display:block; }
.time-option .ext-price { font-size:10px; display:block; margin-top:2px; }
</style>
</head>
<body>
<div class="nav-top"><a href="../../../index.html">返回导航</a></div>
<div class="phone">
  <div class="tab-bar">
    <div class="tab active" onclick="switchOrderTab('active',this)">进行中</div>
    <div class="tab" onclick="switchOrderTab('upcoming',this)">待使用</div>
    <div class="tab" onclick="switchOrderTab('completed',this)">已完成</div>
  </div>
  <div class="page" id="orderList"></div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='../home/index.html'"><div class="nav-icon">🏠</div><div class="nav-label">主页</div></div>
    <div class="nav-item" onclick="location.href='../room-list/index.html'"><div class="nav-icon">📅</div><div class="nav-label">预订</div></div>
    <div class="nav-item" onclick="location.href='../tea-shop/index.html'"><div class="nav-icon">🍵</div><div class="nav-label">茶品</div></div>
    <div class="nav-item active"><div class="nav-icon">📋</div><div class="nav-label">订单</div></div>
    <div class="nav-item" onclick="location.href='../member-center/index.html'"><div class="nav-icon">👤</div><div class="nav-label">我的</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="cancelModal">
  <div class="modal">
    <h3>取消预约</h3>
    <p id="cancelMsg"></p>
    <div class="modal-buttons"><button class="modal-btn cancel" onclick="hideModal()">再想想</button><button class="modal-btn danger" onclick="confirmCancel()">确认取消</button></div>
  </div>
</div>
<div class="modal-overlay" id="extendModal">
  <div class="modal">
    <h3>续订包间</h3>
    <p id="extendInfo">请选择续订至何时：</p>
    <div class="time-picker" id="extendOptions"></div>
    <div class="modal-buttons"><button class="modal-btn cancel" onclick="hideExtendModal()">取消</button><button class="modal-btn confirm" id="extendConfirmBtn" disabled onclick="doExtendOrder()">确认续订</button></div>
  </div>
</div>
<div class="modal-overlay" id="detailModal">
  <div class="modal" id="detailContent"></div>
</div>

<!-- Logistics Detail Modal -->
<div class="lg-modal-overlay" id="lgModal" onclick="if(event.target===this)hideLogistics()">
  <div class="lg-modal">
    <div class="lg-modal-header">
      <h3>物流详情</h3>
      <span class="lg-modal-close" onclick="hideLogistics()">✕</span>
    </div>
    <div id="lgTrackInfo"></div>
    <div id="lgTimeline"></div>
  </div>
</div>

<script>
// ── SDK init ──
var SDK = window.ERP.SDK;
var API = SDK.API;
var UI = SDK.UI;
var Utils = SDK.Utils;

let currentOrderTab = 'active';
let cancelTarget = null;
let extendTarget = null;
let selectedExtendIdx = null;

// ── Logistics helpers ──
function pad2(n) { return (n < 10 ? '0' : '') + n; }

function addDays(dateStr, days) {
  var parts = dateStr.split('-').map(Number);
  var d = new Date(parts[0], parts[1]-1, parts[2]);
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function getLogistics(order) {
  var created = order.createdAt || order.date;
  var baseDate = (created || '').slice(0, 10) || '2026-05-18';
  // Use orderId hash to generate deterministic tracking number
  var idStr = order.orderId || order.id || '';
  var hash = 0;
  for (var i = 0; i < idStr.length; i++) { hash = ((hash << 5) - hash) + idStr.charCodeAt(i); hash |= 0; }
  var trackingSuffix = String((Math.abs(hash) % 9000000000) + 1000000000);

  if (order.status === 'Shipping') {
    // Approx hours since order
    var now = new Date();
    var then = new Date(created || now);
    var hoursSince = (now - then) / 3600000;

    if (hoursSince < 48 || order.manualPending) {
      // Not shipped yet
      return {
        status: 'pending', label: '待发货',
        carrier: null, trackingNo: null,
        estimated: '预计3-5个工作日发货',
        updates: []
      };
    } else if (hoursSince < 120) {
      // In transit
      var day1 = addDays(baseDate, 1);
      return {
        status: 'transit', label: '运输中',
        carrier: '顺丰速运', trackingNo: 'SF' + trackingSuffix,
        estimated: '预计1-2天送达',
        updates: [
          { time: day1 + ' 20:00', desc: '包裹已被快递员揽收' },
          { time: day1 + ' 08:15', desc: '包裹已从【杭州仓】发出' }
        ]
      };
    } else {
      // Should be delivered - upgrade status
      var d2 = addDays(baseDate, 3);
      var d1 = addDays(baseDate, 2);
      return {
        status: 'delivered', label: '已签收',
        carrier: '顺丰速运', trackingNo: 'SF' + trackingSuffix,
        estimated: '已签收',
        updates: [
          { time: d2 + ' 18:30', desc: '包裹已被【前台】签收' },
          { time: d1 + ' 08:15', desc: '包裹已到达【上海分拨中心】' },
          { time: addDays(d1, -1) + ' 20:00', desc: '包裹已被快递员揽收' }
        ]
      };
    }
  } else if (order.status === 'Completed' || order.status === 'ShopCompleted') {
    // Delivered
    var d2 = addDays(baseDate, 2);
    return {
      status: 'delivered', label: '已签收',
      carrier: '顺丰速运', trackingNo: 'SF' + trackingSuffix,
      estimated: '已签收',
      updates: [
        { time: d2 + ' 18:30', desc: '包裹已被【前台】签收' },
        { time: addDays(d2, -1) + ' 08:15', desc: '包裹已到达【上海分拨中心】' },
        { time: baseDate + ' 20:00', desc: '包裹已被快递员揽收' }
      ]
    };
  }
  return null;
}

function renderLogisticsCard(lg) {
  if (!lg) return '';
  var html = '<div class="logistics-card">';

  if (lg.status === 'pending') {
    // No tracking yet
    html += '<div style="display:flex;align-items:center;justify-content:space-between;">' +
      '<span style="font-size:13px;color:#999;">📦 物流信息</span>' +
      '<span class="ls-badge pending">待发货</span></div>' +
      '<div style="font-size:12px;color:#bbb;margin-top:4px;">' + lg.estimated + '</div>';
  } else {
    html += '<div class="logistics-header">' +
      '<span class="logistics-carrier"><span class="carrier-icon">📦</span>' + (lg.carrier || '') + '</span>' +
      '<span class="logistics-tracking">' +
        '<span class="tracking-num" onclick="showLogistics(\'' + (lg._orderId || '') + '\')">' + (lg.trackingNo || '') + ' →</span>' +
      '</span></div>';

    // Progress dots
    var steps = [
      { key: 'shipped', label: '已发货' },
      { key: 'transit', label: '运输中' },
      { key: 'delivered', label: '已签收' }
    ];
    var statusIdx = lg.status === 'delivered' ? 2 : lg.status === 'transit' ? 1 : 0;

    html += '<div class="ls-progress">';
    for (var i = 0; i < steps.length; i++) {
      if (i > 0) html += '<div class="ls-line' + (i <= statusIdx ? ' active' : '') + '"></div>';
      html += '<div class="ls-step">' +
        '<span class="ls-step-dot' +
          (i < statusIdx ? ' active' : '') +
          (i === statusIdx ? ' current' : '') +
        '"></span>' +
        '<span class="ls-step-label' +
          (i < statusIdx ? ' active' : '') +
          (i === statusIdx ? ' current' : '') +
        '">' + steps[i].label + '</span></div>';
    }
    html += '</div>';

    html += '<div class="ls-status-row">' +
      '<span class="ls-badge ' + lg.status + '">' + lg.label + '</span>' +
      '<span class="ls-estimated">' + lg.estimated + '</span>' +
      '<button class="logistics-btn" onclick="showLogistics(\'' + (lg._orderId || '') + '\')">查看详情 →</button>' +
      '</div>';
  }

  html += '</div>';
  return html;
}

function renderLogisticsModal(lg) {
  if (!lg) return;
  var infoHtml = '<div class="lg-track-info">' +
    '<div class="lg-carrier">📦 ' + (lg.carrier || '待发货') + '</div>' +
    (lg.trackingNo ? '<div>运单号：' + lg.trackingNo + '</div>' : '') +
    '<div>状态：<span style="font-weight:600;">' + lg.label + '</span></div>' +
    '</div>';

  var tlHtml = '<div class="lg-timeline">';
  if (lg.updates && lg.updates.length) {
    var totalUpdates = lg.updates.length;
    for (var i = 0; i < totalUpdates; i++) {
      var u = lg.updates[i];
      var isLast = i === totalUpdates - 1;
      var dotCls = isLast && lg.status !== 'pending' ? 'current' : 'done';
      var descCls = isLast && lg.status !== 'pending' ? 'current' : '';
      tlHtml += '<div class="lg-tl-item">' +
        '<div style="position:relative;">' +
          '<div class="lg-tl-dot ' + dotCls + '"></div>' +
          (!isLast ? '<div class="lg-tl-line done"></div>' : '') +
        '</div>' +
        '<div class="lg-tl-content">' +
          '<div class="lg-tl-desc ' + descCls + '">' + u.desc + '</div>' +
          '<div class="lg-tl-time">' + u.time + '</div>' +
        '</div></div>';
    }
  } else {
    tlHtml += '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">暂无物流信息</div>';
  }
  tlHtml += '</div>';

  document.getElementById('lgTrackInfo').innerHTML = infoHtml;
  document.getElementById('lgTimeline').innerHTML = tlHtml;
  document.getElementById('lgModal').style.display = 'flex';
}

var savedBookings = Utils.lsGet('bookings', []).map(function(b) {
  // Normalize field names for display:
  // bookings use startTime/endTime → render code expects "time"
  // bookings use amount → render code expects "price"
  if (!b.time && b.startTime) b.time = (b.startTime||'').slice(0,5) + '-' + (b.endTime||'').slice(0,5);
  if (b.amount !== undefined && b.price === undefined) b.price = b.amount;
  return b;
});
var orders = savedBookings.concat([
  { id:"ORD001", roomId:"RM004", roomName:"大茶室C", date:"2026-05-08", time:"10:00-11:30", price:180, status:"InUse", doorCode:"8264", doorValid:true, remaining:45, endTime:"11:30", duration:"90" },
  { id:"ORD003", roomId:"RM004", roomName:"大茶室C", date:"2026-05-08", time:"16:00-18:00", price:240, status:"Booked", doorCode:null, doorValid:false, endTime:"18:00" },
  { id:"ORD006", roomId:"RM003", roomName:"中茶室B", date:"2026-05-09", time:"10:00-12:00", price:240, status:"Booked", doorCode:null, doorValid:false, endTime:"12:00" },
  { id:"ORD004", roomId:"RM002", roomName:"中茶室A", date:"2026-05-07", time:"10:00-12:00", price:160, status:"Completed", payment:"微信支付" },
  { id:"ORD005", roomId:"RM001", roomName:"大会议室", date:"2026-05-07", time:"14:00-18:00", price:800, status:"Completed", payment:"余额支付" },
  { id:"ORD007", roomId:"RM004", roomName:"大茶室C", date:"2026-05-06", time:"14:00-17:00", price:360, status:"Completed", payment:"微信支付" },
]);

function switchOrderTab(tab, el) {
  currentOrderTab = tab;
  el.parentElement.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  renderOrders();
}

function renderOrders() {
  var container = document.getElementById('orderList');
  var shopOrders = Utils.lsGet('shop_orders', []);
  var mappedShopOrders = shopOrders.map(function(s) {
    var mapped = {
      id: s.orderId, roomName: '茶品雅集', date: s.date || '', time: s.time || '',
      price: s.totalAmount, status: s.status, isShop: true, items: s.items,
      payment: s.payment || '微信支付', createdAt: s.createdAt,
      orderId: s.orderId
    };
    mapped.logistics = getLogistics(mapped);
    if (mapped.logistics) mapped.logistics._orderId = mapped.orderId || mapped.id;
    return mapped;
  });
  var allOrders = orders.concat(mappedShopOrders);
  var filtered;
  if (currentOrderTab === 'active') filtered = allOrders.filter(function(o) { return o.status === 'InUse' || o.status === 'Shipping' || o.status === 'RoomCharge'; });
  else if (currentOrderTab === 'upcoming') filtered = allOrders.filter(function(o) { return o.status === 'Booked'; });
  else filtered = allOrders.filter(function(o) { return o.status === 'Completed' || o.status === 'ShopCompleted'; });

  if (!filtered.length) {
    container.innerHTML = '<div style="padding:16px;"><div class="empty"><div class="empty-icon">📭</div><p>暂无订单</p></div></div>';
    return;
  }

  container.innerHTML = '<div style="padding:16px 0;">' + filtered.map(function(o) {
    var encName = encodeURIComponent(o.roomName || '');
    var durationVal = o.duration || '90';
    var html = '';

    if (o.status === 'InUse') {
      html = '<div class="order-card">' +
        '<div class="order-header"><span class="order-room">' + o.roomName + '</span><span class="order-status status-inuse">使用中</span></div>' +
        '<div class="order-time">' + (o.date||'') + ' ' + (o.time||'') + '</div>' +
        '<div class="order-price">¥' + (o.price||0) + '</div>' +
        (o.doorCode ? '<div class="door-section">' +
          '<div><div class="door-label">门禁密码</div><div class="door-code">' + o.doorCode + '</div></div>' +
          '<button class="order-btn ghost" onclick="copyCode(\'' + o.doorCode + '\')">📋 复制</button>' +
        '</div>' : '') +
        '<div class="big-actions">' +
          '<button class="big-action-btn primary" onclick="location.href=\'../room-control/index.html?roomId=' + o.roomId + '&roomName=' + encName + '&duration=' + durationVal + '\'">🚪 开门</button>' +
          '<button class="big-action-btn outline" onclick="showExtendOrder(\'' + o.id + '\')">⏱ 续订</button>' +
        '</div></div>';
    } else if (o.status === 'Booked') {
      var isClose = o.date === '2026-05-08';
      html = '<div class="order-card">' +
        '<div class="order-header"><span class="order-room">' + o.roomName + '</span><span class="order-status status-booked">已预定</span></div>' +
        '<div class="order-time">' + (o.date||'') + ' ' + (o.time||'') + '</div>' +
        '<div class="order-price">¥' + (o.price||0) + '</div>' +
        '<div class="door-section"><div class="door-label">门禁密码</div><div class="door-hint">预约前30分钟显示</div></div>' +
        '<div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
          '<button class="order-btn outline" onclick="useNow(\'' + o.id + '\')">立即使用</button>' +
          '<button class="order-btn danger" onclick="showCancel(\'' + o.id + '\',' + (!isClose) + ')">取消预约</button>' +
          '<span class="cancel-note">' + (isClose ? '距开始不足2小时，取消收取定金50%' : '距开始超过2小时，可免费取消') + '</span>' +
        '</div></div>';
    } else if (o.isShop && o.status === 'Shipping') {
      var shipItemsHtml = '';
      if (o.items && o.items.length) {
        for (var si = 0; si < o.items.length; si++) {
          if (si > 0) shipItemsHtml += ' · ';
          shipItemsHtml += o.items[si].name + ' ×' + o.items[si].qty;
        }
      }
      var lgHtml = renderLogisticsCard(o.logistics);
      html = '<div class="order-card">' +
        '<div class="order-header"><span class="order-room">' + o.roomName + '</span><span class="order-status status-booked" style="background:#fff3e0;color:#e37318;">待发货</span></div>' +
        '<div class="order-time">' + (o.date||'') + '</div>' +
        '<div class="order-price">¥' + (o.price||0) + '</div>' +
        '<div style="font-size:13px;color:#666;margin-bottom:8px;">' + shipItemsHtml + '</div>' +
        lgHtml +
        '<div style="margin-top:10px;display:flex;gap:8px;">' +
        '<button class="order-btn outline" style="flex:1;" onclick="showShopDetail(\'' + (o.orderId||o.id) + '\')">查看详情</button>' +
        (o.logistics && o.logistics.trackingNo ? '<button class="order-btn ghost" style="flex:1;" onclick="showLogistics(\'' + (o.orderId||o.id) + '\')">📦 查看物流</button>' : '') +
        '</div></div>';
    } else if (o.isShop && o.status === 'RoomCharge') {
      var rcItemsHtml = '';
      if (o.items && o.items.length) {
        for (var ri = 0; ri < o.items.length; ri++) {
          if (ri > 0) rcItemsHtml += ' · ';
          rcItemsHtml += o.items[ri].name + ' ×' + o.items[ri].qty;
        }
      }
      html = '<div class="order-card">' +
        '<div class="order-header"><span class="order-room">' + o.roomName + '</span><span class="order-status status-inuse" style="background:#fff3e0;color:#e65100;">挂账中</span></div>' +
        '<div class="order-time">' + (o.date||'') + '</div>' +
        '<div class="order-price">¥' + (o.price||0) + '</div>' +
        '<div style="font-size:13px;color:#666;margin-bottom:8px;">' + rcItemsHtml + '</div>' +
        '<div style="font-size:12px;color:#999;margin-bottom:8px;">离店时统一结算</div>' +
        '<button class="order-btn outline" onclick="showShopDetail(\'' + (o.orderId||o.id) + '\')">查看详情</button></div>';
    } else if (o.isShop) {
      var shopItemsHtml = '';
      if (typeof o.items === 'string') shopItemsHtml = o.items;
      else if (o.items && o.items.length) {
        for (var si2 = 0; si2 < o.items.length; si2++) {
          if (si2 > 0) shopItemsHtml += ' · ';
          shopItemsHtml += o.items[si2].name + ' ×' + o.items[si2].qty;
        }
      }
      var clgHtml = renderLogisticsCard(o.logistics);
      html = '<div class="order-card">' +
        '<div class="order-header"><span class="order-room">' + o.roomName + '</span><span class="order-status status-inuse" style="background:#e3f2fd;color:#0052d9;">已完成</span></div>' +
        '<div class="order-time">' + (o.date||'') + '</div>' +
        '<div class="order-price">¥' + (o.price||0) + '</div>' +
        '<div style="font-size:13px;color:#666;margin-bottom:8px;">' + shopItemsHtml + '</div>' +
        clgHtml +
        '<div style="margin-top:10px;display:flex;gap:8px;">' +
        '<button class="order-btn outline" style="flex:1;" onclick="showShopDetail(\'' + (o.orderId||o.id) + '\')">查看详情</button>' +
        (o.logistics && o.logistics.trackingNo ? '<button class="order-btn ghost" style="flex:1;" onclick="showLogistics(\'' + (o.orderId||o.id) + '\')">📦 查看物流</button>' : '') +
        '</div></div>';
    } else {
      html = '<div class="order-card">' +
        '<div class="order-header"><span class="order-room">' + o.roomName + '</span><span class="order-status status-completed">已完成</span></div>' +
        '<div class="order-time">' + (o.date||'') + ' ' + (o.time||'') + '</div>' +
        '<div class="order-price">¥' + (o.price||0) + '</div>' +
        '<div style="font-size:13px;color:#666;margin-bottom:8px;">支付方式: ' + (o.payment||'—') + '</div>' +
        '<button class="order-btn outline" onclick="location.href=\'../room-detail/index.html?id=' + o.roomId + '\'">再次预约</button>' +
        '<button class="order-btn ghost" style="margin-left:8px;" onclick="showDetail(\'' + o.id + '\')">查看详情</button></div>';
    }
    return html;
  }).join('') + '</div>';
}

// Cancel
function showCancel(id, free) {
  cancelTarget = id;
  document.getElementById('cancelMsg').textContent = free ? '距开始时间超过2小时，免费取消' : '距开始不足2小时，将收取定金的50%作为违约金';
  document.getElementById('cancelModal').style.display = 'flex';
}
function confirmCancel() {
  if (cancelTarget) {
    for (var i = 0; i < orders.length; i++) {
      if (orders[i].id === cancelTarget) { orders[i].status = 'Cancelled'; break; }
    }
    UI.toast('订单已取消，退款将退回原支付方式');
  }
  hideModal(); cancelTarget = null; renderOrders();
}

// Extend
function useNow(id) {
  for (var i = 0; i < orders.length; i++) {
    if (orders[i].id === id) {
      orders[i].status = 'InUse';
      var encName = encodeURIComponent(orders[i].roomName || '包间');
      location.href = '../room-control/index.html?roomId=' + orders[i].roomId + '&roomName=' + encName + '&duration=90';
      break;
    }
  }
}

function showExtendOrder(id) {
  extendTarget = id;
  var o = null;
  for (var i = 0; i < orders.length; i++) { if (orders[i].id === id) { o = orders[i]; break; } }
  if (!o) return;
  var et = o.endTime || (o.time ? o.time.split('-')[1] : '12:00');
  var parts = et.split(':');
  var endH = parseInt(parts[0]), endM = parseInt(parts[1]) || 0;
  var baseMin = Math.ceil((endH * 60 + endM) / 30) * 30;
  document.getElementById('extendInfo').innerHTML =
    '<div>订单日期: <b>' + o.date + '</b> · 原时段: <b>' + o.time + '</b></div>' +
    '<div style="margin-top:4px;">当前将于 <b>' + et + '</b> 结束。请选择续订至何时：</div>';
  var optsHtml = '';
  for (var i = 1; i <= 8; i++) {
    var totalMin = baseMin + i * 30;
    var h = Math.floor(totalMin / 60) % 24;
    var m = totalMin % 60;
    var extMin = i * 30;
    var price = Math.round(120 * extMin / 60);
    optsHtml += '<div class="time-option" id="extOpt' + i + '" onclick="selectExtOpt(' + i + ')">' +
      '<span class="ext-time">至 ' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + '</span>' +
      '<span class="ext-price">+' + extMin + '分钟 ¥' + price + '</span></div>';
  }
  document.getElementById('extendOptions').innerHTML = optsHtml;
  selectedExtendIdx = null;
  document.getElementById('extendConfirmBtn').disabled = true;
  document.getElementById('extendModal').style.display = 'flex';
}
function selectExtOpt(i) {
  document.querySelectorAll('#extendOptions .time-option').forEach(function(o) { o.classList.remove('selected'); });
  document.getElementById('extOpt'+i).classList.add('selected');
  selectedExtendIdx = i;
  document.getElementById('extendConfirmBtn').disabled = false;
}
function doExtendOrder() {
  if (selectedExtendIdx === null || !extendTarget) return;
  var o = null;
  for (var i = 0; i < orders.length; i++) { if (orders[i].id === extendTarget) { o = orders[i]; break; } }
  if (!o) return;
  var extMin = selectedExtendIdx * 30;
  var price = Math.round(120 * extMin / 60);
  API.getBalance().then(function(balance) {
    var newBalance = balance - price;
    var user = Utils.lsGet('user', {});
    user.balance = newBalance;
    Utils.lsSet('user', user);
  });
  o.price += price;
  var et = o.endTime || (o.time ? o.time.split('-')[1] : '12:00');
  var parts = et.split(':');
  var newMin = (parseInt(parts[0])*60 + (parseInt(parts[1])||0)) + extMin;
  o.endTime = String(Math.floor(newMin/60)%24).padStart(2,'0') + ':' + String(newMin%60).padStart(2,'0');
  o.time = o.time.split('-')[0] + '-' + o.endTime;
  hideExtendModal();
  UI.toast('续订成功！已续订至 ' + o.endTime + '，¥' + price + ' 已从余额扣除');
  renderOrders();
}
function hideExtendModal() { document.getElementById('extendModal').style.display = 'none'; extendTarget = null; }

// Detail
function showDetail(id) {
  var o = null;
  for (var i = 0; i < orders.length; i++) { if (orders[i].id === id) { o = orders[i]; break; } }
  if (!o) { showShopDetail(id); return; }
  document.getElementById('detailContent').innerHTML =
    '<h3>订单详情</h3>' +
    '<div style="text-align:left;font-size:13px;color:#666;">' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>包间</span><span>' + o.roomName + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>日期</span><span>' + (o.date||'') + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>时间</span><span>' + (o.time||'') + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>金额</span><span style="font-weight:700;color:#e37318;">¥' + (o.price||0) + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>支付方式</span><span>' + (o.payment||'—') + '</span></div>' +
    '</div>' +
    '<button class="modal-btn cancel" style="margin-top:12px;width:100%;" onclick="document.getElementById(\'detailModal\').style.display=\'none\'">关闭</button>';
  document.getElementById('detailModal').style.display = 'flex';
}

function showShopDetail(id) {
  var shopOrders = Utils.lsGet('shop_orders', []);
  var o = null;
  for (var i = 0; i < shopOrders.length; i++) {
    if (shopOrders[i].orderId === id || shopOrders[i].id === id) { o = shopOrders[i]; break; }
  }
  if (!o) { UI.toast('订单信息未找到'); return; }
  var statusLabel = o.status === 'Shipping' ? '待发货' : '已完成';
  var itemsHtml = '';
  if (typeof o.items === 'string') itemsHtml = o.items;
  else if (o.items && o.items.length) {
    for (var k = 0; k < o.items.length; k++) {
      var item = o.items[k];
      itemsHtml += '<div style="display:flex;justify-content:space-between;padding:4px 0;">' +
        '<span>' + item.name + ' ×' + item.qty + '</span><span>¥' + (item.price * item.qty) + '</span></div>';
    }
  }
  document.getElementById('detailContent').innerHTML =
    '<h3>商品订单详情</h3>' +
    '<div style="text-align:left;font-size:13px;color:#666;">' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>订单号</span><span>' + (o.orderId || o.id) + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>日期</span><span>' + (o.date||'') + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;"><span>状态</span><span style="font-weight:600;">' + statusLabel + '</span></div>' +
    '<div style="margin-top:8px;border-top:1px solid #eee;padding-top:8px;">' + itemsHtml + '</div>' +
    '<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #eee;margin-top:8px;"><span>合计</span><span style="font-weight:700;color:#e37318;">¥' + (o.totalAmount || o.price) + '</span></div>' +
    '</div>' +
    '<button class="modal-btn cancel" style="margin-top:12px;width:100%;" onclick="document.getElementById(\'detailModal\').style.display=\'none\'">关闭</button>';
  document.getElementById('detailModal').style.display = 'flex';
}

// ── Logistics ──
function showLogistics(orderId) {
  var shopOrders = Utils.lsGet('shop_orders', []);
  var o = null;
  for (var i = 0; i < shopOrders.length; i++) {
    if (shopOrders[i].orderId === orderId || shopOrders[i].id === orderId) { o = shopOrders[i]; break; }
  }
  if (!o) { UI.toast('订单信息未找到'); return; }
  var mapped = {
    id: o.orderId, roomName: '茶品雅集', date: o.date || '', time: o.time || '',
    price: o.totalAmount, status: o.status, isShop: true, items: o.items,
    payment: o.payment || '微信支付', createdAt: o.createdAt,
    orderId: o.orderId
  };
  var lg = getLogistics(mapped);
  if (lg) renderLogisticsModal(lg);
}

function hideLogistics() {
  document.getElementById('lgModal').style.display = 'none';
}

function copyCode(code) {
  navigator.clipboard && navigator.clipboard.writeText(code).then(function() { UI.toast('密码已复制'); }).catch(function() { UI.toast('密码: '+code); });
}

function hideModal() { document.getElementById('cancelModal').style.display = 'none'; }
// Using SDK.UI.toast
renderOrders();
</script>
</body>
</html>
