<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫码落座</title>
<script src="../../js/sdk.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.phone { width:100%; max-width:100%; min-height:100vh; background:#fff; display:flex; flex-direction:column; }
.page { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; }

/* Loading */
.loading-state { text-align:center; }
.loading-spinner { width:40px; height:40px; border:3px solid #e8e8e8; border-top-color:#5D8A6B; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Success */
.success-state { width:100%; max-width:360px; text-align:center; }
.success-icon { width:72px; height:72px; background:linear-gradient(135deg,#5D8A6B,#00a854); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:36px; color:#fff; box-shadow:0 4px 16px rgba(93,138,107,.3); }
.room-name { font-size:24px; font-weight:700; color:#1a1a1a; margin-bottom:4px; }
.room-location { font-size:14px; color:#999; margin-bottom:24px; }
.bill-preview { background:#f9fafb; border-radius:12px; padding:16px; margin-bottom:24px; text-align:left; }
.bill-preview-title { font-size:12px; color:#999; margin-bottom:8px; }
.bill-preview-row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; color:#333; }
.bill-preview-row.total { border-top:1px solid #e8e8e8; margin-top:4px; padding-top:10px; font-weight:600; }
.bill-preview-row .label { color:#666; }
.bill-preview-row .value { color:#B8860B; }
.action-btns { width:100%; display:flex; flex-direction:column; gap:12px; margin-top:8px; }
.btn-primary { padding:16px; background:linear-gradient(135deg,#5D8A6B,#7BA88E); color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; text-align:center; }
.btn-primary:active { opacity:.85; }
.btn-outline { padding:14px; background:#fff; color:#5D8A6B; border:1.5px solid #5D8A6B; border-radius:12px; font-size:14px; font-weight:500; cursor:pointer; text-align:center; }
.btn-outline:active { background:#f0fdf4; }
.btn-link { background:none; border:none; color:#999; font-size:13px; cursor:pointer; padding:8px; }
.btn-link:active { color:#666; }

/* Error */
.error-state { width:100%; max-width:360px; text-align:center; }
.error-icon { width:72px; height:72px; background:#fce4e4; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:36px; color:#e53935; }
.error-title { font-size:18px; font-weight:600; color:#333; margin-bottom:8px; }
.error-desc { font-size:14px; color:#999; margin-bottom:24px; line-height:1.6; }
</style>
</head>
<body>
<div class="phone">
  <div class="page" id="app">
    <!-- Loading -->
    <div id="loadingState" class="loading-state">
      <div class="loading-spinner"></div>
      <div style="color:#999;font-size:15px;">正在验证房间状态...</div>
    </div>

    <!-- Success -->
    <div id="successState" class="success-state" style="display:none">
      <div class="success-icon">✅</div>
      <div class="room-name" id="roomName"></div>
      <div class="room-location" id="roomLocation">扫码加购自动挂入房间账单</div>

      <div class="bill-preview" id="billPreview" style="display:none">
        <div class="bill-preview-title">📋 当前账单</div>
        <div class="bill-preview-row"><span class="label">房费</span><span class="value" id="roomCharge">¥0</span></div>
        <div class="bill-preview-row"><span class="label">加购挂账</span><span class="value" id="scanTotal">¥0</span></div>
        <div class="bill-preview-row total"><span class="label">待结算</span><span class="value" id="pendingPayment">¥0</span></div>
      </div>

      <div class="action-btns">
        <button class="btn-primary" onclick="goOrder()">🛒 点单加购</button>
        <button class="btn-outline" onclick="goBill()">📋 查看房间账单</button>
        <button class="btn-link" onclick="callStaff()">📞 联系店员</button>
      </div>
    </div>

    <!-- Error -->
    <div id="errorState" class="error-state" style="display:none">
      <div class="error-icon">⚠️</div>
      <div class="error-title" id="errorTitle">无法扫码</div>
      <div class="error-desc" id="errorDesc">该房间暂无进行中的订单，请联系店员开房后再扫码点单。</div>
      <button class="btn-outline" onclick="callStaff()" style="width:100%">📞 联系店员</button>
      <button class="btn-link" onclick="goHome()" style="margin-top:12px">← 返回首页</button>
    </div>
  </div>
</div>

<script>
var ROOM_ID = '';
var STORE_ID = '';
var TABLE_ID = '';

// Parse URL params
(function() {
  var params = new URLSearchParams(window.location.search);
  ROOM_ID = params.get('room_id') || '';
  STORE_ID = params.get('store_id') || '';
  TABLE_ID = params.get('table_id') || '';
  if (!ROOM_ID) {
    showError('参数错误', '缺少房间信息，请重新扫码');
  } else {
    verifyRoom();
  }
})();

function verifyRoom() {
  ERP.SDK.API.scanRoomStatus(ROOM_ID).then(function(info) {
    if (info.hasActiveOrder && info.status === 'Active') {
      onVerified(info);
    } else {
      showError('房间不可用', info.message || '请联系店员开房后再扫码');
    }
  }).catch(function(err) {
    showError('验证失败', err.message || '网络异常，请重试');
  });
}

function onVerified(info) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('successState').style.display = 'block';
  document.getElementById('roomName').textContent = '🏠 ' + info.roomName;
  if (TABLE_ID) {
    document.getElementById('roomLocation').textContent = TABLE_ID + '号桌 · 扫码加购自动挂入账单';
  }

  // Try to load bill preview
  ERP.SDK.API.getScanBill(ROOM_ID).then(function(bill) {
    document.getElementById('billPreview').style.display = 'block';
    document.getElementById('roomCharge').textContent = '¥' + bill.billSummary.roomCharge.toFixed(2);
    document.getElementById('scanTotal').textContent = '¥' + bill.billSummary.scanTotal.toFixed(2);
    document.getElementById('pendingPayment').textContent = '¥' + bill.billSummary.pendingPayment.toFixed(2);
  }).catch(function() {});
}

function showError(title, desc) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display = 'block';
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorDesc').textContent = desc;
}

function goOrder() {
  window.location.href = '../scan-order/index.html?room_id=' + ROOM_ID + '&store_id=' + STORE_ID;
}

function goBill() {
  window.location.href = '../scan-bill/index.html?room_id=' + ROOM_ID + '&store_id=' + STORE_ID;
}

function callStaff() {
  ERP.SDK.UI.toast('📞 前台电话：020-88888888');
}

function goHome() {
  window.location.href = '../home/index.html';
}
</script>
</body>
</html>
