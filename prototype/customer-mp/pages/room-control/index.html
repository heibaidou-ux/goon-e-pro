<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>房内智控</title>
<script src="../../js/sdk.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; display:flex; justify-content:center; height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.phone { width:375px; height:100vh; background:#f5f7fa; display:flex; flex-direction:column; position:relative; }
.nav-top { position:fixed; top:10px; right:20px; z-index:200; }
.nav-top a { font-size:12px; color:#666; text-decoration:none; background:rgba(255,255,255,.95); padding:6px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.nav-bar { display:flex; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #f0f0f0; }
.back-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; }
.nav-title { flex:1; text-align:center; font-size:16px; font-weight:600; }
.status-badge { font-size:12px; padding:4px 10px; border-radius:12px; }
.status-badge.active { background:#e8f5e9; color:#00a870; }
.page { flex:1; overflow-y:auto; scrollbar-width:none; padding:16px 16px 60px; }
.page::-webkit-scrollbar { display:none; }
.remaining-bar { background:#fff; border-radius:12px; padding:14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; }
.remaining-text { font-size:13px; color:#666; }
.remaining-time { font-size:24px; font-weight:700; color:#e37318; }
.remaining-time.urgent { color:#d54941; }
.remaining-end { font-size:11px; color:#999; }

/* Quick action cards */
.action-cards { display:flex; gap:12px; margin-bottom:16px; }
.action-card { flex:1; padding:18px 14px; border-radius:14px; text-align:center; cursor:pointer; border:none; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .15s,box-shadow .15s; }
.action-card:active { transform:scale(.97); }
.action-card .ac-icon { font-size:28px; }
.action-card .ac-label { font-size:14px; font-weight:600; }
.action-card .ac-sub { font-size:11px; opacity:.7; }
.action-card.primary { background:linear-gradient(135deg,#07c160,#00a854); color:#fff; box-shadow:0 4px 14px rgba(7,193,96,.35); }
.action-card.secondary { background:linear-gradient(135deg,#7c4dff,#651fff); color:#fff; box-shadow:0 4px 14px rgba(124,77,255,.3); }

/* Bluetooth music control */
.music-control { background:#fff; border-radius:12px; padding:16px; margin-bottom:16px; }
.music-header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.music-cover { width:48px; height:48px; border-radius:10px; background:linear-gradient(135deg,#07c160,#00a854); display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; }
.music-info { flex:1; }
.music-track { font-size:14px; font-weight:600; }
.music-artist { font-size:11px; color:#999; margin-top:1px; }
.music-buttons { display:flex; justify-content:center; gap:24px; }
.music-btn { width:44px; height:44px; border-radius:50%; border:none; background:#f5f7fa; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.music-btn:active { background:#e5e5e5; }
.music-btn.play { width:52px; height:52px; background:#07c160; color:#fff; font-size:20px; }
.volume-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
.volume-icon { font-size:14px; }
.volume-bar { flex:1; height:6px; background:#e5e5e5; border-radius:3px; position:relative; cursor:pointer; }
.volume-fill { height:100%; background:#07c160; border-radius:3px; }

/* Audio source selector */
.source-section { background:#fff; border-radius:14px; padding:14px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
.source-title { font-size:12px; font-weight:600; color:#666; margin-bottom:10px; }
.source-buttons { display:flex; gap:10px; }
.source-btn { flex:1; padding:12px; border-radius:10px; text-align:center; cursor:pointer; font-size:13px; font-weight:500; transition:all .2s; border:1.5px solid #e5e5e5; background:#fff; }
.source-btn:active { transform:scale(.97); }
.source-btn.active { border-color:#07c160; background:#f0fdf4; color:#07c160; font-weight:600; }

/* Device controls */
.device-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.device-card { background:#fff; border-radius:14px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.04); }
.device-info { display:flex; align-items:center; gap:12px; }
.device-icon-box { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.device-icon-box.curtain { background:#e3f2fd; }
.device-icon-box.ac { background:#fce4ec; }
.device-icon-box.light { background:#fff8e1; }
.device-name { font-size:14px; font-weight:600; }
.device-status { font-size:11px; color:#999; margin-top:2px; }
.toggle-switch { width:48px; height:28px; border-radius:14px; background:#e5e5e5; cursor:pointer; position:relative; transition:background .2s; flex-shrink:0; }
.toggle-switch.on { background:#07c160; }
.toggle-switch::after { content:''; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.15); transition:transform .2s; }
.toggle-switch.on::after { transform:translateX(20px); }

/* Modal */
.modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99;display:none;align-items:center;justify-content:center; }
.modal { background:#fff;border-radius:14px;padding:20px;width:320px;max-height:85vh;overflow-y:auto;text-align:center; }
.modal h3 { font-size:16px;margin-bottom:8px;color:#333; }
.modal p { font-size:13px;color:#666;margin-bottom:16px; }
.modal-buttons { display:flex;gap:10px; }
.modal-btn { flex:1;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600; }
.modal-btn.cancel { background:#f5f5f5;color:#666; }
.modal-btn.primary { background:#07c160;color:#fff; }
.time-picker { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
.time-option { padding:12px 8px; border-radius:8px; border:1.5px solid #e5e5e5; background:#fff; cursor:pointer; font-size:13px; text-align:center; transition:all .15s; }
.time-option:hover { border-color:#07c160; }
.time-option.selected { background:#07c160; color:#fff; border-color:#07c160; }
.time-option .ext-time { font-weight:600; display:block; }
.time-option .ext-price { font-size:11px; display:block; margin-top:2px; }
.toast { position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:100;display:none; }
.bottom-nav { display:flex; border-top:1px solid #eee; background:#fff; flex-shrink:0; }
.nav-item { flex:1; text-align:center; padding:10px 0 6px; cursor:pointer; color:#999; text-decoration:none; }
.nav-item .nav-icon { font-size:20px; display:block; }
.nav-item .nav-label { font-size:10px; margin-top:2px; }
.nav-item.active { color:#07c160; }
</style>
</head>
<body>
<div class="nav-top"><a href="../../../index.html">返回导航</a></div>
<div class="phone">
  <div class="nav-bar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="nav-title" id="roomCtrlTitle">包间</span>
    <span class="status-badge active">使用中</span>
  </div>
  <div class="page">
    <!-- Remaining time -->
    <div class="remaining-bar">
      <div>
        <div class="remaining-text">剩余时间</div>
        <div class="remaining-time" id="countdown">45:00</div>
      </div>
      <div class="remaining-end" id="endTime">11:30 结束</div>
    </div>

    <!-- Quick actions -->
    <div class="action-cards">
      <button class="action-card primary" onclick="showExtend()">
        <span class="ac-icon">⏱</span>
        <span class="ac-label">续订</span>
      </button>
      <button class="action-card secondary" onclick="location.href='../tea-shop/index.html'">
        <span class="ac-icon">🍵</span>
        <span class="ac-label">茶品</span>
      </button>
    </div>

    <!-- Music control -->
    <div class="music-control">
      <div class="music-header">
        <div class="music-cover">🎵</div>
        <div class="music-info">
          <div class="music-track" id="trackName">高山流水 - 古琴</div>
          <div class="music-artist" id="musicStatus">▶ 播放中</div>
        </div>
      </div>
      <div class="music-buttons">
        <button class="music-btn" onclick="prevTrack()">⏮</button>
        <button class="music-btn play" id="playBtn" onclick="togglePlay()">⏸</button>
        <button class="music-btn" onclick="nextTrack()">⏭</button>
      </div>
      <div class="volume-row">
        <span class="volume-icon">🔈</span>
        <div class="volume-bar" onclick="adjustVolume(event)"><div class="volume-fill" id="volumeFill" style="width:70%"></div></div>
        <span style="font-size:12px;color:#666;min-width:32px;text-align:right;" id="volumeValue">70%</span>
      </div>
    </div>

    <!-- Audio source -->
    <div class="source-section">
      <div class="source-title">音源选择</div>
      <div class="source-buttons">
        <button class="source-btn" data-source="bluetooth" onclick="switchAudioSource('bluetooth')">🔵 蓝牙</button>
        <button class="source-btn active" data-source="bgm" onclick="switchAudioSource('bgm')">🎵 背景音乐</button>
      </div>
    </div>

    <!-- Device control -->
    <div class="device-grid">
      <div class="device-card">
        <div class="device-info">
          <span class="device-icon-box curtain">🪟</span>
          <div><div class="device-name">电动窗帘</div><div class="device-status" id="curtainStatus">已关闭</div></div>
        </div>
        <div class="toggle-switch" id="curtainToggle" onclick="toggleCurtain()"></div>
      </div>
      <div class="device-card">
        <div class="device-info">
          <span class="device-icon-box ac">❄️</span>
          <div><div class="device-name">空调</div><div class="device-status" id="acStatus">制冷 24°C</div></div>
        </div>
        <div class="toggle-switch on" id="acToggle" onclick="toggleAC()"></div>
      </div>
      <div class="device-card">
        <div class="device-info">
          <span class="device-icon-box light">💡</span>
          <div><div class="device-name">灯光</div><div class="device-status" id="lightStatus">已开启</div></div>
        </div>
        <div class="toggle-switch on" id="lightToggle" onclick="toggleLight()"></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='../home/index.html'"><div class="nav-icon">🏠</div><div class="nav-label">主页</div></div>
    <div class="nav-item" onclick="location.href='../room-list/index.html'"><div class="nav-icon">📅</div><div class="nav-label">预订</div></div>
    <div class="nav-item" onclick="location.href='../tea-shop/index.html'"><div class="nav-icon">🍵</div><div class="nav-label">茶品</div></div>
    <div class="nav-item" onclick="location.href='../my-orders/index.html'"><div class="nav-icon">📋</div><div class="nav-label">订单</div></div>
    <div class="nav-item" onclick="location.href='../member-center/index.html'"><div class="nav-icon">👤</div><div class="nav-label">我的</div></div>
  </div>
</div>

<!-- Extend Modal -->
<div class="modal-overlay" id="extendModal">
  <div class="modal">
    <h3>续订包间</h3>
    <p id="extendInfo">当前将于 11:30 结束。请选择续订至何时：</p>
    <div class="time-picker" id="extendOptions"></div>
    <div class="modal-buttons"><button class="modal-btn cancel" onclick="hideModal('extend')">取消</button><button class="modal-btn primary" id="extendConfirmBtn" disabled onclick="doExtend()">确认续订</button></div>
  </div>
</div>

<!-- Extend Payment Modal -->
<div class="modal-overlay" id="extendPayModal">
  <div class="modal">
    <h3>确认续订支付</h3>
    <p id="extendPayInfo">续订至 —</p>
    <div style="font-size:28px;font-weight:800;color:#e37318;margin:8px 0;" id="extendPayAmount">¥0</div>
    <p style="font-size:12px;color:#999;">从账户余额扣除</p>
    <div class="modal-buttons"><button class="modal-btn cancel" onclick="cancelExtendPay()">取消</button><button class="modal-btn primary" onclick="confirmExtendPay()">确认支付</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── SDK init ──
var SDK = window.ERP.SDK;
var API = SDK.API;
var UI = SDK.UI;
var Utils = SDK.Utils;

// ── State ──
var ctrlParams = new URLSearchParams(window.location.search);
var ctrlRoomId = ctrlParams.get('roomId') || 'RM004';
var ctrlRoomName = ctrlParams.get('roomName') || '大茶室C';
var ctrlDuration = parseInt(ctrlParams.get('duration') || '90');
var ctrlDateStr = ctrlParams.get('date') || '';
var ctrlSlot = ctrlParams.get('slot') || '';
document.getElementById('roomCtrlTitle').textContent = ctrlRoomName;

// Parse end time from slot for date-aware display
var ctrlEndDate = null;
if (ctrlSlot && ctrlDateStr) {
  var slotParts = ctrlSlot.split('-');
  if (slotParts.length >= 2) {
    var endTimeStr = slotParts[1].trim();
    var endH = parseInt(endTimeStr.split(':')[0]);
    var endM = parseInt(endTimeStr.split(':')[1]);
    var startTimeStr = slotParts[0].trim();
    var startH = parseInt(startTimeStr.split(':')[0]);
    ctrlEndDate = new Date(ctrlDateStr);
    if (endH <= startH) ctrlEndDate.setDate(ctrlEndDate.getDate() + 1);
    ctrlEndDate.setHours(endH, endM, 0, 0);
  }
}

function formatEndTime(date) {
  if (!date) return '';
  var h = String(date.getHours()).padStart(2,'0');
  var m = String(date.getMinutes()).padStart(2,'0');
  var today = new Date();
  if (date.toDateString() !== today.toDateString()) {
    return (date.getMonth()+1) + '月' + date.getDate() + '日 ' + h + ':' + m;
  }
  return h + ':' + m;
}

function updateEndDisplay(date) {
  var el = document.getElementById('endTime');
  if (date) el.textContent = formatEndTime(date) + ' 结束';
}

let isPlaying = true;
let volume = 70;
let remaining = ctrlDuration * 60;
let curtainOpen = false;
let acOn = true;
let lightOn = true;
let selectedExtendTime = null;

const tracks = ['高山流水 - 古琴', '渔舟唱晚 - 古筝', '平湖秋月 - 琵琶', '梅花三弄 - 笛子'];
let trackIdx = 0;

// ── Audio source switching (T-6715) ──
function switchAudioSource(source) {
  API.switchAudioSource(ctrlRoomId, source).then(function() {
    document.querySelectorAll('.source-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-source') === source);
    });
    if (source !== 'bgm') {
      isPlaying = false;
      document.getElementById('playBtn').textContent = '▶';
      document.getElementById('musicStatus').textContent = '⏸ 已暂停';
    } else {
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸';
      document.getElementById('musicStatus').textContent = '▶ 播放中';
    }
  });
}

// ── Music control ──
function togglePlay() {
  isPlaying = !isPlaying;
  document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
  document.getElementById('musicStatus').textContent = isPlaying ? '▶ 播放中' : '⏸ 已暂停';
}
function prevTrack() {
  trackIdx = (trackIdx - 1 + tracks.length) % tracks.length;
  document.getElementById('trackName').textContent = tracks[trackIdx];
  UI.toast('上一首');
}
function nextTrack() {
  trackIdx = (trackIdx + 1) % tracks.length;
  document.getElementById('trackName').textContent = tracks[trackIdx];
  UI.toast('下一首');
}
function adjustVolume(e) {
  var rect = e.currentTarget.getBoundingClientRect();
  volume = Math.round(((e.clientX - rect.left) / rect.width) * 100);
  volume = Math.min(100, Math.max(0, volume));
  document.getElementById('volumeFill').style.width = volume + '%';
  document.getElementById('volumeValue').textContent = volume + '%';
  API.setVolume(ctrlRoomId, volume);
}

// ── Device controls (via API) ──
function toggleCurtain() {
  curtainOpen = !curtainOpen;
  var toggle = document.getElementById('curtainToggle');
  toggle.classList.toggle('on', curtainOpen);
  document.getElementById('curtainStatus').textContent = curtainOpen ? '已开启' : '已关闭';
  API.getRoomDevices(ctrlRoomId).then(function(devices) {
    for (var i = 0; i < devices.length; i++) {
      if (devices[i].type === 'Curtain') {
        API.controlDevice(devices[i].deviceId, { position: curtainOpen ? 'open' : 'closed' });
        break;
      }
    }
  });
}

function toggleAC() {
  acOn = !acOn;
  var toggle = document.getElementById('acToggle');
  toggle.classList.toggle('on', acOn);
  document.getElementById('acStatus').textContent = acOn ? '制冷 24°C' : '已关闭';
  API.getRoomDevices(ctrlRoomId).then(function(devices) {
    for (var i = 0; i < devices.length; i++) {
      if (devices[i].type === 'AC') {
        API.controlDevice(devices[i].deviceId, { mode: acOn ? 'cool' : 'off', temperature: acOn ? 24 : undefined });
        break;
      }
    }
  });
}

function toggleLight() {
  lightOn = !lightOn;
  var toggle = document.getElementById('lightToggle');
  toggle.classList.toggle('on', lightOn);
  document.getElementById('lightStatus').textContent = lightOn ? '已开启' : '已关闭';
  API.getRoomDevices(ctrlRoomId).then(function(devices) {
    for (var i = 0; i < devices.length; i++) {
      if (devices[i].type === 'Light') {
        API.controlDevice(devices[i].deviceId, { on: lightOn });
        break;
      }
    }
  });
}

// ── Extend ──
function showExtend() {
  var now = new Date();
  var curEndMin = now.getHours() * 60 + now.getMinutes() + Math.ceil(remaining / 60);
  var roundedEndMin = Math.ceil(curEndMin / 30) * 30;
  var actualEndH = Math.floor(roundedEndMin / 60) % 24;
  var actualEndM = roundedEndMin % 60;

  document.getElementById('extendInfo').innerHTML =
    '<div>当前将于 <b>' + String(actualEndH).padStart(2,'0') + ':' + String(actualEndM).padStart(2,'0') + '</b> 结束。请选择续订至何时：</div>';

  var options = [];
  for (var i = 1; i <= 8; i++) {
    var totalMin = roundedEndMin + i * 30;
    var h = Math.floor(totalMin / 60) % 24;
    var m = totalMin % 60;
    var extMin = i * 30;
    var price = Math.round(120 * extMin / 60);
    options.push({ time: String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'), extMin: extMin, price: price });
  }

  document.getElementById('extendOptions').innerHTML = options.map(function(o, i) {
    return '<div class="time-option" id="extOpt' + i + '" onclick="selectExtend(' + i + ')">' +
      '<span class="ext-time">至 ' + o.time + '</span>' +
      '<span class="ext-price">+' + o.extMin + '分钟 ¥' + o.price + '</span></div>';
  }).join('');

  selectedExtendTime = null;
  document.getElementById('extendConfirmBtn').disabled = true;
  showModal('extend');
}

function selectExtend(i) {
  document.querySelectorAll('.time-option').forEach(function(o) { o.classList.remove('selected'); });
  document.getElementById('extOpt' + i).classList.add('selected');
  selectedExtendTime = i;
  document.getElementById('extendConfirmBtn').disabled = false;
}

function doExtend() {
  if (selectedExtendTime === null) return;
  var opts = [30,60,90,120,150,180,210,240];
  var extMin = opts[selectedExtendTime];
  var extPrice = Math.round(120 * extMin / 60);
  var optEl = document.getElementById('extOpt' + selectedExtendTime);
  var newEndTime = optEl ? optEl.querySelector('.ext-time').textContent.replace('至 ','') : '';
  document.getElementById('extendPayInfo').textContent = '续订至 ' + newEndTime + '，+' + extMin + '分钟';
  document.getElementById('extendPayAmount').textContent = '¥' + extPrice;
  document.getElementById('extendPayModal').style.display = 'flex';
}

function confirmExtendPay() {
  var opts = [30,60,90,120,150,180,210,240];
  var extMin = opts[selectedExtendTime];
  var extPrice = Math.round(120 * extMin / 60);
  API.getBalance().then(function(balance) {
    var newBalance = balance - extPrice;
    var user = Utils.lsGet('user', {});
    user.balance = newBalance;
    Utils.lsSet('user', user);
    remaining += extMin * 60;
    if (ctrlEndDate) {
      ctrlEndDate = new Date(ctrlEndDate.getTime() + extMin * 60000);
      updateEndDisplay(ctrlEndDate);
    }
    document.getElementById('extendPayModal').style.display = 'none';
    hideModal('extend');
    UI.toast('续订成功！¥' + extPrice + ' 已从余额扣除，余额 ¥' + newBalance);
  });
}

function cancelExtendPay() {
  document.getElementById('extendPayModal').style.display = 'none';
  UI.toast('已取消续订');
}

// ── Modal helpers ──
function showModal(id) { document.getElementById(id + 'Modal').style.display = 'flex'; }
function hideModal(id) { document.getElementById(id + 'Modal').style.display = 'none'; }

// ── Countdown ──
function updateCountdown() {
  var m = Math.floor(remaining / 60), s = remaining % 60;
  var el = document.getElementById('countdown');
  el.textContent = m + ':' + String(s).padStart(2,'0');
  if (remaining <= 15*60) el.classList.add('urgent');
  if (remaining > 0) { remaining--; setTimeout(updateCountdown, 1000); }
  else { UI.toast('订单已超时'); setTimeout(function() { location.href='../my-orders/index.html'; }, 2000); }
}

// ── Init ──
updateCountdown();
updateEndDisplay(ctrlEndDate);
</script>
</body>
</html>
