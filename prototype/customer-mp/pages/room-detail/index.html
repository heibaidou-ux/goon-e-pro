<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>包间预订</title>
<script src="../../js/sdk.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.phone { width:100%; max-width:100%; min-height:100vh; background:#fff; display:flex; flex-direction:column; position:relative; }
.nav-top { position:fixed; top:10px; right:20px; z-index:200; }
.nav-top a { font-size:12px; color:#666; text-decoration:none; background:rgba(255,255,255,.95); padding:6px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.nav-bar { display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid #e8e4de; background:#fff; }
.back-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; }
.nav-title { flex:1; text-align:center; font-size:16px; font-weight:600; margin-right:28px; }
.page { flex:1; overflow-y:auto; scrollbar-width:none; }
.page::-webkit-scrollbar { display:none; }

/* Unified room header card — 素雅色调 */
.room-header-card { margin:0; padding:16px; color:#fff; }
.room-header-card.gradient-tea { background:linear-gradient(135deg,#5D8A6B 0%,#7BA88E 100%); }
.room-header-card.gradient-meeting { background:linear-gradient(135deg,#7A8B8B 0%,#A3B5B5 100%); }
.room-header-card.gradient-exhibition { background:linear-gradient(135deg,#B8860B 0%,#D4A84B 100%); }
.room-header-card.gradient-workshop { background:linear-gradient(135deg,#8B7D6B 0%,#B5A896 100%); }
.room-header-top { display:flex; align-items:center; gap:12px; }
.room-header-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; background:rgba(255,255,255,.2); flex-shrink:0; }
.room-header-name { font-size:17px; font-weight:700; }
.room-header-meta { font-size:12px; opacity:.85; margin-top:2px; }
.room-header-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.room-header-tags .facility-tag { background:rgba(255,255,255,.2); color:#fff; padding:2px 10px; border-radius:10px; font-size:11px; }

/* Date bar */
.date-bar { display:flex; align-items:center; padding:10px 12px; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.date-bar::-webkit-scrollbar { display:none; }
.date-chip { min-width:54px; padding:8px 4px; border-radius:10px; text-align:center; cursor:pointer; border:1.5px solid #e0d8d0; background:#fff; font-size:11px; transition:all .15s; flex-shrink:0; }
.date-chip .d-week { font-size:10px; color:#999; }
.date-chip .d-day { font-size:16px; font-weight:600; margin:1px 0; }
.date-chip .d-month { font-size:10px; color:#999; }
.date-chip.today { border-color:#5D8A6B; }
.date-chip.selected { background:#5D8A6B; color:#fff; border-color:#5D8A6B; }
.date-chip.selected .d-week, .date-chip.selected .d-month { color:rgba(255,255,255,.7); }
.date-more { flex-shrink:0; padding:10px 8px; border-radius:10px; cursor:pointer; border:1.5px solid #e0d8d0; background:#fff; font-size:12px; color:#666; text-align:center; min-width:42px; }

/* Duration selector */
.section-label { font-size:12px; font-weight:600; color:#333; margin-bottom:8px; }
.duration-section { padding:12px 12px 4px; }
.duration-grid { display:flex; gap:6px; flex-wrap:wrap; }
.duration-chip { flex:1; min-width:60px; padding:10px 4px; border-radius:10px; text-align:center; cursor:pointer; border:1.5px solid #e0d8d0; background:#fff; font-size:12px; font-weight:600; transition:all .15s; }
.duration-chip:active { opacity:.7; }
.duration-chip.selected { border-color:#5D8A6B; background:#F2F6F0; color:#5D8A6B; }

/* Custom hours input */
.custom-hours-row { padding:6px 12px; display:none; align-items:center; gap:8px; }
.custom-hours-row .ch-label { font-size:12px; color:#666; }
.custom-hours-input { width:72px; padding:8px 10px; border:1.5px solid #5D8A6B; border-radius:8px; font-size:15px; font-weight:600; color:#5D8A6B; text-align:center; outline:none; background:#F2F6F0; }
.custom-hours-input:focus { border-color:#4A7A5A; }
.custom-hours-input::placeholder { color:#bbb; font-weight:400; font-size:13px; }

/* Form rows */
.form-row { padding:6px 12px; display:flex; align-items:center; gap:8px; }
.form-label { font-size:12px; font-weight:600; color:#333; min-width:48px; flex-shrink:0; }
.form-row .now-btn { padding:8px 16px; border-radius:16px; background:#5D8A6B; color:#fff; border:none; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
.form-row .now-btn:active { opacity:.8; }
.form-row .time-or { font-size:11px; color:#ccc; }
.form-row select { flex:1; padding:8px 10px; border-radius:8px; border:1.5px solid #e0d8d0; background:#fff; font-size:13px; color:#333; appearance:auto; }
.duration-select-wrap { display:inline-block; position:relative; }
.cd-select { padding:8px 12px; border-radius:8px; border:1.5px solid #5D8A6B; background:#F2F6F0; font-size:13px; font-weight:600; color:#5D8A6B; }

/* Conflict alert */
.conflict-alert { margin:4px 12px; padding:10px 14px; border-radius:8px; background:#FDF6EC; border:1px solid #F0E0C0; font-size:12px; color:#8B7D6B; display:none; }
.conflict-alert .suggest-time { color:#5D8A6B; font-weight:600; cursor:pointer; text-decoration:underline; }

/* Inline info */
.info-bar { padding:2px 12px 6px; display:flex; gap:16px; font-size:10px; color:#999; }

/* In-page bottom (subtotal + confirm) */
.inpage-bottom { padding:16px 12px; border-top:1px solid #e8e4de; margin-top:8px; }
.inpage-total { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.inpage-total .total-label { font-size:13px; color:#999; flex-shrink:0; }
.inpage-total .total-price { font-size:20px; font-weight:700; color:#B8860B; flex-shrink:0; }
.inpage-total .total-detail { font-size:12px; color:#999; flex:1; text-align:right; }
.inpage-total .total-detail.active { font-size:17px; font-weight:700; color:#B8860B; }
.inpage-book-btn { width:100%; padding:14px; border-radius:10px; background:#5D8A6B; color:#fff; border:none; font-size:16px; font-weight:600; cursor:pointer; }
.inpage-book-btn:active { opacity:.8; }
.inpage-book-btn:disabled { background:#d0d0d0; cursor:not-allowed; }

/* Calendar modal */
.cal-modal { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99;display:none;align-items:center;justify-content:center; }
.cal-modal-content { background:#fff;border-radius:14px;padding:16px;width:320px; }
.cal-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:10px; }
.cal-month { font-size:15px;font-weight:600; }
.cal-nav { width:30px;height:30px;border-radius:50%;border:1.5px solid #e0d8d0;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center; }
.cal-weekdays { display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#999;margin-bottom:4px; }
.cal-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center; }
.cal-day { padding:8px 0;font-size:13px;border-radius:8px;cursor:pointer; }
.cal-day:hover { background:#F2F6F0; }
.cal-day.today { font-weight:700;color:#5D8A6B; }
.cal-day.selected { background:#5D8A6B;color:#fff;font-weight:600; }
.cal-day.other { color:#ddd;cursor:default; }
.cal-day.past { color:#ddd;cursor:default; }
.cal-close { margin-top:10px;padding:10px;border-radius:8px;border:none;background:#5D8A6B;color:#fff;font-size:14px;cursor:pointer;width:100%; }

.no-booking { text-align:center; padding:40px 20px; color:#999; }
.toast { position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:100;display:none; }
.bottom-nav { display:flex; border-top:1px solid #e8e4de; background:#fff; flex-shrink:0; }
.nav-item { flex:1; text-align:center; padding:10px 0 6px; cursor:pointer; color:#999; text-decoration:none; }
.nav-item .nav-icon { font-size:20px; display:block; }
.nav-item .nav-label { font-size:10px; margin-top:2px; }
.nav-item.active { color:#5D8A6B; }
</style>
</head>
<body>
<div class="nav-top"><a href="../../../index.html">返回导航</a></div>
<div class="phone">
  <div class="nav-bar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="nav-title" id="roomTitle">加载中...</span>
  </div>
  <div class="page" id="pageContent"></div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='../home/index.html'"><div class="nav-icon">🏠</div><div class="nav-label">主页</div></div>
    <div class="nav-item active"><div class="nav-icon">📅</div><div class="nav-label">预订</div></div>
    <div class="nav-item" onclick="location.href='../tea-shop/index.html'"><div class="nav-icon">🍵</div><div class="nav-label">茶品</div></div>
    <div class="nav-item" onclick="location.href='../my-orders/index.html'"><div class="nav-icon">📋</div><div class="nav-label">订单</div></div>
    <div class="nav-item" onclick="location.href='../member-center/index.html'"><div class="nav-icon">👤</div><div class="nav-label">我的</div></div>
  </div>
</div>
<div class="cal-modal" id="calModal" onclick="if(event.target===this)hideCalModal()">
  <div class="cal-modal-content">
    <div class="cal-header">
      <button class="cal-nav" onclick="calChangeMonth(-1)">◀</button>
      <span class="cal-month" id="calMonth"></span>
      <button class="cal-nav" onclick="calChangeMonth(1)">▶</button>
    </div>
    <div class="cal-weekdays" id="calWeekdays"></div>
    <div class="cal-grid" id="calGrid"></div>
    <button class="cal-close" onclick="hideCalModal()">关闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// Room data — flat hourly rate (space/time pricing, not per-person)
const rooms = [
  { roomId:"RM004", name:"大茶室C", type:"茶室", capacity:6, area:25, facilities:["茶台","K歌","投影","落地窗"], pricePerHour:120 },
  { roomId:"RM001", name:"大会议室", type:"会议室", capacity:10, area:30, facilities:["投影","会议桌","K歌设备","落地窗"], pricePerHour:200 },
  { roomId:"RM002", name:"中茶室A", type:"茶室", capacity:4, area:18, facilities:["茶台","落地窗","茶具套装"], pricePerHour:80 },
  { roomId:"RM003", name:"中茶室B", type:"茶室", capacity:4, area:18, facilities:["茶台","落地窗","茶具套装"], pricePerHour:80 },
  { roomId:"RM005", name:"展厅", type:"展厅", capacity:20, area:40, facilities:["前台","收银","茶具展示","休闲区"], bookable:false },
  { roomId:"RM006", name:"工作间", type:"工作间", capacity:2, area:12, facilities:["储物","机柜"], bookable:false },
];

const heroes = { '茶室':'🍵', '会议室':'💼', '展厅':'🏛️', '工作间':'🔧' };
const gradClassMap = { '茶室':'gradient-tea', '会议室':'gradient-meeting', '展厅':'gradient-exhibition', '工作间':'gradient-workshop' };

const params = new URLSearchParams(window.location.search);
const roomId = params.get('id') || 'RM004';
const room = rooms.find(r => r.roomId === roomId) || rooms[0];
const hourRate = room.pricePerHour || 120;

document.getElementById('roomTitle').textContent = room.name;
document.getElementById('calWeekdays').innerHTML = ['日','一','二','三','四','五','六'].map(d => '<span>'+d+'</span>').join('');
const page = document.getElementById('pageContent');

// ── State ──
const today = new Date(); today.setHours(0,0,0,0);
const now = new Date();
let selectedDate = new Date(today);
let selectedStart = null;   // "HH:MM"
let selectedEnd = null;     // "HH:MM"
let selectedDuration = null; // 120/180/240, or null for custom
let isCustomMode = false;
let customStep = 'start';   // 'start' or 'end' in custom mode
let calYear = today.getFullYear(), calMonth = today.getMonth();

// ── Render main content ──
function renderPage() {
  if (!room.bookable && (roomId==='RM005'||roomId==='RM006')) {
    var gc = gradClassMap[room.type] || 'gradient-workshop';
    page.innerHTML =
      '<div class="room-header-card ' + gc + '"><div class="room-header-top"><div class="room-header-icon">' + (heroes[room.type]||'🏠') + '</div><div><div class="room-header-name">' + room.name + '</div><div class="room-header-meta">容纳 ' + room.capacity + '人 · ' + room.area + '㎡ · 非预约空间</div></div></div><div class="room-header-tags">' + room.facilities.map(function(f) { return '<span class="facility-tag">' + f + '</span>'; }).join('') + '</div></div>' +
      '<div class="no-booking"><div style="font-size:48px;margin-bottom:12px;">' + (roomId==='RM005'?'🏛️':'🔧') + '</div><p style="font-size:16px;font-weight:600;color:#333;">' + (roomId==='RM005'?'自由参观，无需预约':'员工专用空间') + '</p><p style="font-size:13px;margin-top:8px;">' + (roomId==='RM005'?'展厅为开放区域，自由使用。如需使用包间，请选择茶室或会议室预约。':'工作间为员工储物和设备机柜空间，不对外开放。') + '</p><button style="margin-top:16px;padding:10px 24px;border-radius:8px;background:#5D8A6B;color:#fff;border:none;font-size:14px;cursor:pointer;" onclick="location.href=\'../home/index.html\'">查看可预约包间</button></div>';
    return;
  }

  var gc = gradClassMap[room.type] || 'gradient-tea';
  var facTags = room.facilities.map(function(f) { return '<span class="facility-tag">' + f + '</span>'; }).join('');
  page.innerHTML =
    '<div class="room-header-card ' + gc + '"><div class="room-header-top"><div class="room-header-icon">' + (heroes[room.type]||'🏠') + '</div><div><div class="room-header-name">' + room.name + '</div><div class="room-header-meta">容纳 ' + room.capacity + '人 · ' + room.area + '㎡ · ¥' + hourRate + '/小时</div></div></div><div class="room-header-tags">' + facTags + '</div></div>' +
    '<div class="date-bar" id="dateBar"></div>' +
    '<div class="duration-section"><div class="section-label">选择时长</div><div class="duration-grid" id="durationGrid"></div>' +
    '<div class="custom-hours-row" id="customHoursRow"><span class="ch-label">自定义</span><input class="custom-hours-input" id="customHoursInput" type="number" min="1" max="24" step="0.5" placeholder="时" oninput="onCustomHoursInput(this.value)"><span class="ch-label">小时</span></div></div>' +
    '<div id="timeRow" class="form-row" style="display:none"><div class="form-label">开始时间</div><button class="now-btn" id="nowBtn" onclick="pickNow()">⚡ 现在开始</button><span class="time-or">或</span><select id="timeSelect" onchange="pickTimeFromSelect(this.value)"><option value="">选择时间...</option></select></div>' +
    '<div class="info-bar"><span>🧹 保洁准备(15min)</span><span>📅 约满时段不显示</span></div>' +
    '<div class="conflict-alert" id="conflictAlert"></div>' +
    '<div class="inpage-bottom"><div class="inpage-total"><span class="total-label">小计</span><span class="total-price" id="totalPrice">¥0</span><span class="total-detail" id="totalDetail">请选择时长和时间</span></div><button class="inpage-book-btn" id="bookBtn" disabled onclick="goPay()">确认预约</button></div>';

  renderDateBar();
  renderDurationGrid();
  updateBilling();
}

// ── Date bar ──
function renderDateBar() {
  const weekNames = ['日','一','二','三','四','五','六'];
  let html = '';
  for (let i = 0; i < 5; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    const isToday = d.toDateString() === today.toDateString();
    const isSelected = d.toDateString() === selectedDate.toDateString();
    let cls = 'date-chip';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    html += '<div class="' + cls + '" onclick="pickDateBar(new Date(' + d.getFullYear() + ',' + d.getMonth() + ',' + d.getDate() + '))"><div class="d-week">周' + weekNames[d.getDay()] + '</div><div class="d-day">' + d.getDate() + '</div><div class="d-month">' + (d.getMonth()+1) + '月</div></div>';
  }
  html += '<div class="date-more" onclick="showCalModal()">更多<br>▾</div>';
  document.getElementById('dateBar').innerHTML = html;
}

window.pickDateBar = function(d) {
  selectedDate = d; resetSelection();
  renderDateBar(); renderDurationGrid(); updateBilling();
  document.getElementById('timeRow').style.display = 'none';
  document.getElementById('customHoursRow').style.display = 'none';
  document.getElementById('conflictAlert').style.display = 'none';
};

function resetSelection() {
  selectedStart = null; selectedEnd = null; selectedDuration = null;
  isCustomMode = false; customStep = 'start'; nowMode = false;
}

// ── Calendar ──
window.showCalModal = function() { document.getElementById('calModal').style.display = 'flex'; renderCalendar(); };
window.hideCalModal = function() { document.getElementById('calModal').style.display = 'none'; };
window.calChangeMonth = function(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
};

function renderCalendar() {
  document.getElementById('calMonth').textContent = calYear + '年 ' + (calMonth+1) + '月';
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const maxDate = new Date(today); maxDate.setDate(today.getDate()+90);
  let cells = '';
  for (let i = firstDay-1; i >= 0; i--) cells += '<div class="cal-day other">' + (daysInPrev-i) + '</div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(calYear, calMonth, d);
    const isToday = dt.toDateString() === today.toDateString();
    const isPast = dt < today;
    const isTooFar = dt > maxDate;
    const isSelected = dt.toDateString() === selectedDate.toDateString();
    let cls = 'cal-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';
    if (isPast || isTooFar) cls += ' past';
    const click = (isPast||isTooFar) ? '' : 'onclick="calPick(' + calYear + ',' + calMonth + ',' + d + ')"';
    cells += '<div class="' + cls + '" ' + click + '>' + d + '</div>';
  }
  const remaining = 42 - firstDay - daysInMonth;
  for (let d = 1; d <= remaining; d++) cells += '<div class="cal-day other">' + d + '</div>';
  document.getElementById('calGrid').innerHTML = cells;
}

window.calPick = function(y, m, d) {
  selectedDate = new Date(y, m, d); resetSelection();
  renderDateBar(); renderDurationGrid(); updateBilling(); hideCalModal();
  document.getElementById('timeRow').style.display = 'none';
  document.getElementById('customHoursRow').style.display = 'none';
  document.getElementById('conflictAlert').style.display = 'none';
};

// ── Booking conflict helpers ──
const existingBookings = {
  RM004: [{ date:'2026-05-10', start:'08:00', end:'10:00' }, { date:'2026-05-10', start:'14:00', end:'16:00' }],
  RM001: [{ date:'2026-05-10', start:'09:00', end:'12:00' }],
  RM002: [{ date:'2026-05-10', start:'10:00', end:'12:30' }],
  RM003: [],
  RM005: [], RM006: [],
};

function getBookedBlocks(roomId, dateStr) {
  const blocks = existingBookings[roomId] || [];
  return blocks.filter(function(b) { return b.date === dateStr; }).map(function(b) {
    var sp = b.start.split(':'), ep = b.end.split(':');
    var sMin = parseInt(sp[0])*60 + parseInt(sp[1]);
    var eMin = parseInt(ep[0])*60 + parseInt(ep[1]);
    if (eMin <= sMin) eMin += 24*60;
    return { startMin: sMin, endMin: eMin };
  });
}

function isTimeBlocked(checkStart, checkEnd, roomId, dateStr) {
  var blocks = getBookedBlocks(roomId, dateStr);
  var nextDate = new Date(dateStr);
  nextDate.setDate(nextDate.getDate() + 1);
  var nextDateStr = nextDate.getFullYear() + '-' + String(nextDate.getMonth()+1).padStart(2,'0') + '-' + String(nextDate.getDate()).padStart(2,'0');
  var allBlocks = blocks.concat(getBookedBlocks(roomId, nextDateStr));
  for (var bi = 0; bi < allBlocks.length; bi++) {
    var b = allBlocks[bi];
    var cleaningEnd = b.endMin + 15;
    if (checkStart < cleaningEnd && checkEnd > b.startMin) return true;
  }
  return false;
}

// ── Duration selector with custom hours input ──
function renderDurationGrid() {
  var durations = [
    { val: 120, label: '2小时' },
    { val: 240, label: '4小时' },
    { val: 360, label: '6小时' },
    { val: 480, label: '8小时' },
    { val: 'custom', label: '自定义' },
  ];
  var html = '';
  for (var i = 0; i < durations.length; i++) {
    var d = durations[i];
    var isSel = (d.val === 'custom' && isCustomMode) || (d.val !== 'custom' && selectedDuration === d.val);
    html += '<div class="duration-chip' + (isSel ? ' selected' : '') + '" onclick="pickDuration(' + (d.val === 'custom' ? "'custom'" : d.val) + ')">' + d.label + '</div>';
  }
  document.getElementById('durationGrid').innerHTML = html;
}

window.pickDuration = function(val) {
  document.getElementById('conflictAlert').style.display = 'none';
  document.getElementById('timeRow').style.display = 'none';
  document.getElementById('customHoursRow').style.display = 'none';
  document.getElementById('customHoursInput').value = '';

  if (val === 'custom') {
    isCustomMode = true;
    selectedDuration = null;
    selectedStart = null;
    selectedEnd = null;
    renderDurationGrid();
    document.getElementById('customHoursRow').style.display = 'flex';
    document.getElementById('customHoursInput').focus();
    updateBilling();
  } else {
    isCustomMode = false;
    selectedDuration = val;
    selectedStart = null;
    selectedEnd = null;
    renderDurationGrid();
    showTimeSelection();
    updateBilling();
  }
};

// ── Custom hours input handler ──
window.onCustomHoursInput = function(value) {
  document.getElementById('conflictAlert').style.display = 'none';
  var hours = parseFloat(value);
  if (!hours || hours < 0.5) {
    selectedDuration = null;
    document.getElementById('timeRow').style.display = 'none';
    updateBilling();
    return;
  }
  hours = Math.min(hours, 24);
  selectedDuration = Math.round(hours * 60);
  showTimeSelection();
  updateBilling();
};

function showTimeSelection() {
  document.getElementById('timeRow').style.display = 'flex';
  populateTimeSelect();
}

function populateTimeSelect() {
  var sel = document.getElementById('timeSelect');
  var isToday = selectedDate.toDateString() === today.toDateString();
  var curMin = isToday ? now.getHours() * 60 + now.getMinutes() : 0;
  var startMin = Math.ceil(curMin / 30) * 30;

  var dateStr = selectedDate.getFullYear() + '-' + String(selectedDate.getMonth()+1).padStart(2,'0') + '-' + String(selectedDate.getDate()).padStart(2,'0');

  var html = '<option value="">选择时间...</option>';
  var maxMin = 24*60 + 6*60;
  for (var m = startMin; m < maxMin; m += 30) {
    var dayOffset = Math.floor(m / (24*60));
    var minInDay = m % (24*60);
    var timeStr = String(Math.floor(minInDay/60)).padStart(2,'0') + ':' + String(minInDay%60).padStart(2,'0');
    var display = dayOffset === 0 ? timeStr : '次日' + timeStr;
    var eMin = selectedDuration ? m + selectedDuration : m + 30;
    if (!isTimeBlocked(m, eMin, roomId, dateStr)) {
      html += '<option value="' + timeStr + '">' + display + '</option>';
    }
  }
  sel.innerHTML = html;
  sel.value = '';
}

// -- Now button --
window.pickNow = function() {
  if (!selectedDuration) {
    showToast('请先选择时长');
    return;
  }
  document.getElementById('conflictAlert').style.display = 'none';

  var curMin = now.getHours() * 60 + now.getMinutes();
  var startTime = String(Math.floor(curMin/60)).padStart(2,'0') + ':' + String(curMin%60).padStart(2,'0');
  var eMin = curMin + selectedDuration;
  var endH = Math.floor(eMin/60) % 24;
  var endM = eMin % 60;
  var endTime = String(endH).padStart(2,'0') + ':' + String(endM).padStart(2,'0');

  var dateStr = selectedDate.getFullYear() + '-' + String(selectedDate.getMonth()+1).padStart(2,'0') + '-' + String(selectedDate.getDate()).padStart(2,'0');

  if (isTimeBlocked(curMin, eMin, roomId, dateStr)) {
    showConflictSuggestion(curMin, selectedDuration, dateStr);
    return;
  }

  selectedStart = startTime;
  selectedEnd = endTime;
  document.getElementById('timeSelect').value = '';
  updateBilling();
};

// -- Time select --
window.pickTimeFromSelect = function(timeStr) {
  if (!timeStr || !selectedDuration) return;
  document.getElementById('conflictAlert').style.display = 'none';

  var sp = timeStr.split(':');
  var sMin = parseInt(sp[0])*60 + parseInt(sp[1]);
  var eMin = sMin + selectedDuration;

  var dateStr = selectedDate.getFullYear() + '-' + String(selectedDate.getMonth()+1).padStart(2,'0') + '-' + String(selectedDate.getDate()).padStart(2,'0');

  if (isTimeBlocked(sMin, eMin, roomId, dateStr)) {
    showConflictSuggestion(sMin, selectedDuration, dateStr);
    document.getElementById('timeSelect').value = '';
    return;
  }

  var endH = Math.floor(eMin/60) % 24;
  var endM = eMin % 60;

  selectedStart = timeStr;
  selectedEnd = String(endH).padStart(2,'0') + ':' + String(endM).padStart(2,'0');
  updateBilling();
};

function showConflictSuggestion(checkMin, duration, dateStr) {
  var maxSearch = 24*60;
  var found = -1;
  for (var m = checkMin + 30; m < maxSearch; m += 30) {
    if (!isTimeBlocked(m, m + duration, roomId, dateStr)) {
      found = m;
      break;
    }
  }

  var alertEl = document.getElementById('conflictAlert');
  if (found >= 0) {
    var h = Math.floor(found/60) % 24;
    var mins = found % 60;
    var suggestTime = String(h).padStart(2,'0') + ':' + String(mins).padStart(2,'0');
    alertEl.innerHTML = '⚠️ 该时段已被预约。<span class="suggest-time">建议从 ' + suggestTime + ' 开始 ›</span>';
    alertEl.querySelector('.suggest-time').onclick = function() { applySuggestedTime(suggestTime); };
  } else {
    alertEl.innerHTML = '⚠️ 该时段已被预约，请选择其他日期。';
  }
  alertEl.style.display = 'block';
}

window.applySuggestedTime = function(timeStr) {
  document.getElementById('conflictAlert').style.display = 'none';
  var sel = document.getElementById('timeSelect');
  sel.value = timeStr;
  pickTimeFromSelect(timeStr);
};

// -- Update billing --
function updateBilling() {
  var tp = document.getElementById('totalPrice');
  var td = document.getElementById('totalDetail');
  var btn = document.getElementById('bookBtn');
  if (!tp) return;
  var price = 0, detail = '', canBook = false;

  if (selectedDuration && selectedStart && selectedEnd) {
    td.className = 'total-detail active';
    if (isCustomMode) {
      var sp = selectedStart.split(':'), ep = selectedEnd.split(':');
      var sMin = parseInt(sp[0])*60 + parseInt(sp[1]);
      var eMin = parseInt(ep[0])*60 + parseInt(ep[1]);
      if (eMin <= sMin) eMin += 24*60;
      var dur = eMin - sMin;
      price = Math.round(hourRate * dur / 60);
      detail = selectedStart + '-' + selectedEnd + ' · ' + Math.floor(dur/60) + 'h' + (dur%60>0?dur%60+'m':'');
    } else {
      price = Math.round(hourRate * selectedDuration / 60);
      detail = selectedStart + '-' + selectedEnd + ' · ' + (selectedDuration/60) + '小时';
    }
    canBook = true;
  } else if (selectedDuration) {
    td.className = 'total-detail';
    detail = '请选择开始时间';
  } else {
    td.className = 'total-detail';
    detail = '请选择时长';
  }

  tp.textContent = '¥' + price;
  td.textContent = detail;
  btn.disabled = !canBook;
}

// -- Go pay --
window.goPay = function() {
  var price, detail, durationMin;
  if (isCustomMode) {
    var sp = selectedStart.split(':'), ep = selectedEnd.split(':');
    var sMin = parseInt(sp[0])*60 + parseInt(sp[1]);
    var eMin = parseInt(ep[0])*60 + parseInt(ep[1]);
    if (eMin <= sMin) eMin += 24*60;
    durationMin = eMin - sMin;
    price = Math.round(hourRate * durationMin / 60);
    detail = selectedStart + '-' + selectedEnd;
  } else {
    durationMin = selectedDuration;
    price = Math.round(hourRate * durationMin / 60);
    detail = selectedStart + '-' + selectedEnd;
  }
  var dateStr = selectedDate.getFullYear() + '-' + String(selectedDate.getMonth()+1).padStart(2,'0') + '-' + String(selectedDate.getDate()).padStart(2,'0');
  var prm = 'roomName=' + encodeURIComponent(room.name) + '&date=' + dateStr + '&slot=' + encodeURIComponent(detail) + '&price=' + price + '&duration=' + durationMin + '&roomId=' + room.roomId + '&sessionType=standard';
  location.href = '../booking-confirm/index.html?' + prm;
};

// ── Init ──
renderPage();

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2000);
}
</script>
