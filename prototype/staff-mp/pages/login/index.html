<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店员登录 - 高岸ERP</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f7fa; display:flex; justify-content:center; padding:20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; align-items:center; }
.phone { width:375px; min-height:600px; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.12); padding:40px 28px; }
.logo { text-align:center; margin-bottom:32px; }
.logo-icon { font-size:48px; }
.logo-name { font-size:20px; font-weight:700; color:#1a365d; margin-top:8px; }
.logo-sub { font-size:12px; color:#999; margin-top:4px; }
.form-group { margin-bottom:20px; }
.form-label { font-size:13px; color:#333; font-weight:500; margin-bottom:6px; display:block; }
.form-input { width:100%; padding:14px; border:1.5px solid #e5e5e5; border-radius:10px; font-size:15px; outline:none; transition:border-color .2s; }
.form-input:focus { border-color:#0052d9; }
.form-input::placeholder { color:#ccc; }
.login-btn { width:100%; padding:16px; border-radius:12px; border:none; background:#0052d9; color:#fff; font-size:16px; font-weight:600; cursor:pointer; transition:opacity .15s; margin-top:8px; }
.login-btn:active { opacity:.8; }
.login-btn:disabled { background:#ccc; cursor:not-allowed; }
.hint { font-size:12px; color:#999; margin-top:16px; text-align:center; line-height:1.8; }
.hint code { background:#f5f5f5; padding:2px 6px; border-radius:4px; font-size:11px; }
.error-msg { color:#d54941; font-size:13px; text-align:center; margin-top:12px; display:none; }
</style>
<script src="../../js/sdk.js"></script>
</head>
<body>
<div class="phone">
  <div class="logo">
    <div class="logo-icon">🏪</div>
    <div class="logo-name">高岸ERP 店员端</div>
    <div class="logo-sub">盈隆店 · 请登录后操作</div>
  </div>
  <div class="form-group">
    <label class="form-label">工号</label>
    <input class="form-input" id="staffId" type="text" placeholder="请输入工号 (S001/S002/S003)" autocomplete="off">
  </div>
  <div class="form-group">
    <label class="form-label">密码</label>
    <input class="form-input" id="password" type="password" placeholder="默认密码 8888">
  </div>
  <div id="errorMsg" class="error-msg"></div>
  <button class="login-btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <div class="hint">
    测试账号<br>
    <code>S001</code> 小林(店长) · <code>S002</code> 小芳(店员) · <code>S003</code> 小王(管理员)<br>
    默认密码: <code>8888</code>
  </div>
</div>
<script>
// 如已登录，直接跳转
if (StaffSDK.API.isStaffLoggedIn()) {
  location.href = '../dashboard/index.html';
}

function doLogin() {
  var staffId = document.getElementById('staffId').value.trim();
  var password = document.getElementById('password').value.trim();
  var btn = document.getElementById('loginBtn');
  var errorEl = document.getElementById('errorMsg');

  if (!staffId) { showError('请输入工号'); return; }
  if (!password) { showError('请输入密码'); return; }

  btn.disabled = true;
  btn.textContent = '登录中...';
  errorEl.style.display = 'none';

  StaffSDK.API.staffLogin(staffId, password).then(function(staff) {
    btn.textContent = '✓ 登录成功';
    setTimeout(function() {
      location.href = '../dashboard/index.html';
    }, 500);
  }).catch(function(err) {
    btn.disabled = false;
    btn.textContent = '登 录';
    showError(err.message || '登录失败，请重试');
  });
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
