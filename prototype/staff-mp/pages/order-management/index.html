<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单管理 - 店员端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; display:flex; justify-content:center; padding:20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.phone { width:375px; height:812px; background:#f5f7fa; border-radius:20px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.12); display:flex; flex-direction:column; position:relative; }
.nav-top { position:fixed; top:10px; right:20px; z-index:200; }
.nav-top a { font-size:12px; color:#666; text-decoration:none; background:rgba(255,255,255,.95); padding:6px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.nav-bar { display:flex; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #f0f0f0; }
.back-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; }
.nav-title { flex:1; text-align:center; font-size:16px; font-weight:600; margin-right:28px; }
.nav-count { font-size:12px; color:#999; }
/* 类型切换 */
.type-tab-row { display:flex; background:#f0f0f0; border-radius:8px; padding:2px; margin:10px 16px 6px; }
.type-tab { flex:1; text-align:center; padding:7px; border-radius:6px; font-size:12px; cursor:pointer; color:#999; font-weight:500; transition:all .15s; border:none; background:transparent; }
.type-tab.active { background:#fff; color:#333; box-shadow:0 1px 3px rgba(0,0,0,.1); }
/* 筛选行 */
.filter-row { display:flex; gap:4px; padding:6px 16px 8px; overflow-x:auto; white-space:nowrap; scrollbar-width:none; -ms-overflow-style:none; }
.filter-row::-webkit-scrollbar { display:none; }
.filter-chip { padding:4px 10px; border-radius:12px; font-size:11px; cursor:pointer; border:none; background:#f0f0f0; color:#999; font-weight:500; flex-shrink:0; transition:all .15s; }
.filter-chip.active { background:#0052d9; color:#fff; }
.page { flex:1; overflow-y:auto; padding:0 16px 60px; }
.page::-webkit-scrollbar { display:none; }
.order-card { background:#fff; border-radius:12px; padding:12px; margin-bottom:8px; border-left:3px solid #ccc; }
.order-card.InUse { border-left-color:#00a870; }
.order-card.Booked { border-left-color:#9c27b0; }
.order-card.Completed { border-left-color:#00a870; opacity:.8; }
.order-card.Cancelled { border-left-color:#999; opacity:.6; }
.order-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
.order-id { font-size:11px; color:#999; }
.order-status { font-size:10px; font-weight:600; padding:2px 8px; border-radius:8px; }
.status-inuse { background:#e8f5e9; color:#00a870; }
.status-booked { background:#f3e5f5; color:#9c27b0; }
.status-completed { background:#e8f5e9; color:#00a870; }
.status-cancelled { background:#f5f5f5; color:#999; }
.order-room { font-size:14px; font-weight:600; margin-bottom:2px; }
.order-room .order-type-badge { font-size:9px; padding:1px 6px; border-radius:6px; margin-left:4px; font-weight:400; }
.type-room { background:#e3f2fd; color:#0052d9; }
.type-tea { background:#e8f5e9; color:#00a870; }
.order-info { font-size:11px; color:#666; line-height:1.5; }
.order-info span { margin-right:8px; }
.order-actions { display:flex; gap:4px; margin-top:6px; }
.order-btn { padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer; border:none; font-weight:500; }
.order-btn.success { background:#e8f5e9; color:#00a870; }
.order-btn.danger { background:#ffebee; color:#d54941; }
.order-btn.primary { background:#e3f2fd; color:#0052d9; }
.order-btn.ghost { background:#f5f5f5; color:#666; }
.staff-badge { font-size:9px; background:#f3e5f5; color:#9c27b0; padding:1px 5px; border-radius:4px; margin-left:4px; }
.empty-state { text-align:center; padding:60px 20px; color:#999; }
.empty-state .icon { font-size:48px; margin-bottom:10px; }
.bottom-nav { display:flex; border-top:1px solid #eee; background:#fff; flex-shrink:0; }
.nav-item { flex:1; text-align:center; padding:10px 0 6px; cursor:pointer; color:#999; }
.nav-item.active { color:#0052d9; }
.nav-item .nav-icon { font-size:20px; }
.nav-item .nav-label { font-size:10px; margin-top:2px; }
</style>
<script src="../../js/sdk.js"></script>
</head>
<body>
<div class="nav-top"><a href="../../../index.html">返回导航</a></div>
<div class="phone">
  <div class="nav-bar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="nav-title">订单管理</span>
    <span class="nav-count" id="orderCount"></span>
  </div>
  <div class="type-tab-row">
    <button class="type-tab active" onclick="setOrderType('all',this)">全部</button>
    <button class="type-tab" onclick="setOrderType('room',this)">🏢 房间</button>
    <button class="type-tab" onclick="setOrderType('tea',this)">🍵 茶品</button>
  </div>
  <div class="filter-row" id="filterRow">
    <button class="filter-chip active" data-filter="today" onclick="setFilter('today',this)">今天</button>
    <button class="filter-chip" data-filter="all" onclick="setFilter('all',this)">全部</button>
    <button class="filter-chip" data-filter="InUse" onclick="setFilter('InUse',this)">使用中</button>
    <button class="filter-chip" data-filter="Booked" onclick="setFilter('Booked',this)">已预订</button>
    <button class="filter-chip" data-filter="Completed" onclick="setFilter('Completed',this)">已完成</button>
    <button class="filter-chip" data-filter="Cancelled" onclick="setFilter('Cancelled',this)">已取消</button>
    <button class="filter-chip" data-filter="Unpaid" onclick="setFilter('Unpaid',this)">未付款</button>
  </div>
  <div class="page" id="orderList"></div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='../dashboard/index.html'"><div class="nav-icon">📊</div><div class="nav-label">工作台</div></div>
    <div class="nav-item active"><div class="nav-icon">📋</div><div class="nav-label">订单</div></div>
    <div class="nav-item" onclick="location.href='../device-monitor/index.html'"><div class="nav-icon">📱</div><div class="nav-label">设备</div></div>
    <div class="nav-item" onclick="location.href='../cleaning-task/index.html'"><div class="nav-icon">🧹</div><div class="nav-label">保洁</div></div>
  </div>
</div>
<script>
var showToast = StaffSDK.UI.toast;
var currentFilter = 'today';
var currentType = 'all';

var roomNames = {};
var roomTypes = {};
StaffSDK.API.getRooms().then(function(rooms) {
  rooms.forEach(function(r) { roomNames[r.roomId] = r.name; roomTypes[r.roomId] = r.type; });
});

var statusLabels = { InUse:'使用中', Booked:'已预订', Completed:'已完成', Cancelled:'已取消' };
var statusClasses = { InUse:'status-inuse', Booked:'status-booked', Completed:'status-completed', Cancelled:'status-cancelled' };

function setOrderType(type, el) {
  currentType = type;
  document.querySelectorAll('.type-tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  renderOrders();
}

function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
  if (el) el.classList.add('active');
  renderOrders();
}

function renderOrders() {
  StaffSDK.API.getAllBookings().then(function(bookings) {
    var today = StaffSDK.Utils.todayStr();
    var filtered = [];

    // Apply type filter
    if (currentType === 'room') {
      bookings = bookings.filter(function(b) { return roomTypes[b.roomId] === 'MeetingRoom'; });
    } else if (currentType === 'tea') {
      bookings = bookings.filter(function(b) { return roomTypes[b.roomId] === 'TeaRoom'; });
    }

    // Apply status filter
    if (currentFilter === 'today') {
      filtered = bookings.filter(function(b) { return b.created && b.created.indexOf(today) === 0; });
    } else if (currentFilter === 'all') {
      filtered = bookings;
    } else if (currentFilter === 'Unpaid') {
      filtered = bookings.filter(function(b) { return b.paymentStatus === 'unpaid' || (!b.paymentStatus && b.status !== 'Completed' && b.status !== 'Cancelled'); });
    } else {
      filtered = bookings.filter(function(b) { return b.status === currentFilter; });
    }

    document.getElementById('orderCount').textContent = filtered.length + '笔';

    var container = document.getElementById('orderList');
    if (!filtered.length) {
      container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无订单</p></div>';
      return;
    }

    container.innerHTML = filtered.map(function(b) {
      var statusCls = statusClasses[b.status] || '';
      var roomName = roomNames[b.roomId] || b.roomName || b.roomId;
      var typeLabel = roomTypes[b.roomId] === 'MeetingRoom' ? '<span class="order-type-badge type-room">房间</span>' : (roomTypes[b.roomId] === 'TeaRoom' ? '<span class="order-type-badge type-tea">茶室</span>' : '');
      var staffTag = b.isStaffBooking ? '<span class="staff-badge">🏪 代订</span>' : '';
      var amount = b.amount ? StaffSDK.Utils.formatMoney(b.amount) : '—';
      var timeStr = (b.startTime || '').slice(0,5) + '-' + (b.endTime || '').slice(0,5);

      var actionsHtml = '';
      if (b.status === 'Booked') {
        actionsHtml = '<button class="order-btn success" onclick="doCheckIn(\'' + b.orderId + '\')">确认到店</button>' +
          '<button class="order-btn danger" onclick="doCancel(\'' + b.orderId + '\')">取消</button>';
      } else if (b.status === 'InUse') {
        actionsHtml = '<button class="order-btn danger" onclick="doCheckOut(\'' + b.orderId + '\')">退房结账</button>' +
          '<button class="order-btn primary" onclick="location.href=\'../device-control/index.html?roomId=' + b.roomId + '\'">设备</button>';
      }

      return '<div class="order-card ' + b.status + '">' +
        '<div class="order-header">' +
        '<span class="order-id">' + b.orderId + staffTag + '</span>' +
        '<span class="order-status ' + statusCls + '">' + (statusLabels[b.status] || b.status) + '</span></div>' +
        '<div class="order-room">' + roomName + typeLabel + '</div>' +
        '<div class="order-info">' +
        '<span>👤 ' + (b.customerName || b.name || '—') + '</span>' +
        '<span>📞 ' + (b.phone || '—') + '</span><br>' +
        '<span>🕐 ' + timeStr + '</span>' +
        '<span>💰 ' + amount + '</span>' +
        (b.paymentStatus === 'paid' ? '<span style="color:#00a870;">✓ 已付</span>' : (b.status === 'Completed' ? '' : '<span style="color:#e37318;">未付</span>')) + '</div>' +
        (actionsHtml ? '<div class="order-actions">' + actionsHtml + '</div>' : '') +
        '</div>';
    }).join('');
  });
}

function doCheckIn(orderId) {
  StaffSDK.API.checkIn(orderId).then(function() {
    showToast('已确认到店');
    renderOrders();
  }).catch(function(e) { showToast(e.message || '操作失败'); });
}

function doCheckOut(orderId) {
  StaffSDK.UI.confirm('确认退房', '结束当前订单并触发节能模式？', '确认退房', '取消').then(function(ok) {
    if (!ok) return;
    StaffSDK.API.checkOut(orderId).then(function() {
      showToast('退房完成，房间转为待打扫');
      renderOrders();
    }).catch(function(e) { showToast(e.message || '操作失败'); });
  });
}

function doCancel(orderId) {
  StaffSDK.UI.confirm('取消订单', '确定取消此订单？', '确认取消', '保留').then(function(ok) {
    if (!ok) return;
    StaffSDK.API.cancelBooking(orderId).then(function() {
      showToast('订单已取消');
      renderOrders();
    }).catch(function(e) { showToast(e.message || '操作失败'); });
  });
}

renderOrders();
</script>
</body>
</html>
