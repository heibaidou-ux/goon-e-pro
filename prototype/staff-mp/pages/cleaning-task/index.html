<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保洁任务 - 店员端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; display:flex; justify-content:center; padding:20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.phone { width:375px; height:812px; background:#f5f7fa; border-radius:20px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.12); display:flex; flex-direction:column; position:relative; }
.nav-top { position:fixed; top:10px; right:20px; z-index:200; }
.nav-top a { font-size:12px; color:#666; text-decoration:none; background:rgba(255,255,255,.95); padding:6px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.nav-bar { display:flex; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #f0f0f0; }
.back-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; }
.nav-title { flex:1; text-align:center; font-size:16px; font-weight:600; margin-right:28px; }
.page { flex:1; overflow-y:auto; scrollbar-width:none; padding:16px; padding-bottom:60px; }
.page::-webkit-scrollbar { display:none; }

/* Tab row */
.tab-row { display:flex; background:#f0f0f0; border-radius:10px; padding:2px; margin-bottom:14px; }
.tab-item { flex:1; text-align:center; padding:10px; border-radius:8px; font-size:13px; cursor:pointer; color:#999; font-weight:500; transition:all .15s; border:none; background:transparent; }
.tab-item.active { background:#fff; color:#333; box-shadow:0 1px 3px rgba(0,0,0,.1); }

/* 任务列表项 */
.task-card { background:#fff; border-radius:12px; padding:14px; margin-bottom:8px; cursor:pointer; border-left:3px solid #ccc; transition:all .15s; display:flex; align-items:center; }
.task-card:active { transform:scale(.98); }
.task-card.pending { border-left-color:#e37318; }
.task-card.inprogress { border-left-color:#0052d9; }
.task-card.completed { border-left-color:#00a870; opacity:.7; }
.task-card-left { flex:1; }
.task-card-room { font-size:15px; font-weight:600; color:#333; }
.task-card-meta { font-size:11px; color:#999; margin-top:2px; display:flex; gap:8px; }
.task-card-badge { font-size:10px; padding:2px 8px; border-radius:8px; font-weight:500; }
.badge-pending { background:#fff3e0; color:#e37318; }
.badge-progress { background:#e3f2fd; color:#0052d9; }
.badge-done { background:#e8f5e9; color:#00a870; }
.task-card-arrow { color:#ccc; font-size:16px; }

/* 详情视图 */
.detail-section { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px; }
.detail-room { font-size:18px; font-weight:700; margin-bottom:4px; }
.detail-meta { font-size:12px; color:#999; line-height:1.6; }
.detail-meta .urgent { color:#d54941; font-weight:500; }
.section-title { font-size:14px; font-weight:600; color:#333; margin-bottom:12px; }
.checklist-item { display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #f5f5f5; cursor:pointer; }
.checklist-item:last-child { border-bottom:none; }
.checklist-check { width:22px; height:22px; border-radius:50%; border:2px solid #ddd; margin-right:12px; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.checklist-check.done { background:#07c160; border-color:#07c160; color:#fff; }
.checklist-label { font-size:14px; color:#333; flex:1; }
.checklist-label.done { color:#999; text-decoration:line-through; }
.checklist-cat { font-size:10px; color:#999; padding:2px 6px; background:#f5f5f5; border-radius:4px; }
.action-btn { width:100%; padding:14px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; transition:opacity .15s; margin-top:8px; }
.action-btn:active { opacity:.8; }
.action-btn.start { background:#0052d9; color:#fff; }
.action-btn.complete { background:#07c160; color:#fff; }
.action-btn.complete:disabled { background:#ccc; cursor:not-allowed; }
.action-btn-hint { font-size:12px; color:#999; text-align:center; margin-top:6px; }
.hidden { display:none; }

.modal-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99;display:none;align-items:center;justify-content:center; }
.modal { background:#fff;border-radius:14px;padding:20px;width:300px;text-align:center; }
.modal h3 { font-size:15px;margin-bottom:8px;color:#333; }
.modal p { font-size:13px;color:#666;margin-bottom:12px; }
.modal-buttons { display:flex;gap:8px; }
.modal-btn { flex:1;padding:10px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600; }
.modal-btn.cancel { background:#f5f5f5;color:#666; }
.modal-btn.confirm { background:#07c160;color:#fff; }

.bottom-nav { display:flex; border-top:1px solid #eee; background:#fff; flex-shrink:0; }
.nav-item { flex:1; text-align:center; padding:10px 0 6px; cursor:pointer; color:#999; }
.nav-item.active { color:#e37318; }
.nav-item .nav-icon { font-size:20px; }
.nav-item .nav-label { font-size:10px; margin-top:2px; }
</style>
<script src="../../js/sdk.js"></script>
</head>
<body>
<div class="nav-top"><a href="../../../index.html">返回导航</a></div>
<div class="phone">
  <div class="nav-bar" id="navBar">
    <button class="back-btn" id="detailBackBtn" onclick="handleBack()">←</button>
    <span class="nav-title" id="navTitle">保洁任务</span>
    <span style="width:28px;"></span>
  </div>
  <div class="page" id="pageContent"></div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='../dashboard/index.html'"><div class="nav-icon">📊</div><div class="nav-label">工作台</div></div>
    <div class="nav-item" onclick="location.href='../order-management/index.html'"><div class="nav-icon">📋</div><div class="nav-label">订单</div></div>
    <div class="nav-item" onclick="location.href='../device-monitor/index.html'"><div class="nav-icon">📱</div><div class="nav-label">设备</div></div>
    <div class="nav-item active"><div class="nav-icon">🧹</div><div class="nav-label">保洁</div></div>
  </div>
</div>
<div class="modal-overlay" id="completeModal">
  <div class="modal">
    <h3>确认保洁完成？</h3>
    <p id="completeMsg"></p>
    <div class="modal-buttons">
      <button class="modal-btn cancel" onclick="hideModal()">再检查</button>
      <button class="modal-btn confirm" onclick="doComplete()">确认完成</button>
    </div>
  </div>
</div>
<script>
var showToast = StaffSDK.UI.toast;
var currentTab = 'inprogress';
var currentView = 'list'; // 'list' or 'detail'
var currentTask = null;
var pendingComplete = null;

const tasks = [
  { taskId:"CLN001", roomName:"中茶室A", status:"Pending", priority:"High", createdAt:"11:55", dueBy:"12:30", staff:"小芳",
    checklist:[{item:"茶台清洁",cat:"surface",done:false},{item:"地面清扫",cat:"floor",done:false},{item:"茶具清洗消毒",cat:"utensil",done:false},{item:"垃圾桶清空",cat:"waste",done:false},{item:"落地窗擦拭",cat:"glass",done:false}],
    devices:[{code:"YL-LOCK-02",type:"🔒",name:"门锁",ok:false,issue:"离线，电池0%",reported:true},{code:"YL-AC-02",type:"❄️",name:"空调",ok:true},{code:"YL-LIGHT-02A",type:"💡",name:"灯光A",ok:true},{code:"YL-LIGHT-02B",type:"💡",name:"灯光B",ok:true},{code:"YL-CURTAIN-02",type:"🪟",name:"窗帘",ok:true},{code:"YL-SPEAKER-02",type:"🔊",name:"音响",ok:true}] },
  { taskId:"CLN002", roomName:"大会议室", status:"InProgress", priority:"Normal", createdAt:"12:00", dueBy:"13:00", staff:"小芳", startedAt:"12:05", remaining:55,
    checklist:[{item:"会议桌擦拭",cat:"surface",done:true},{item:"地面清扫",cat:"floor",done:true},{item:"垃圾桶清空",cat:"waste",done:true},{item:"白板清洁",cat:"surface",done:false}],
    devices:[{code:"YL-LOCK-01",type:"🔒",name:"门锁",ok:true},{code:"YL-AC-01",type:"❄️",name:"空调",ok:true},{code:"YL-LIGHT-01A",type:"💡",name:"灯光A",ok:true},{code:"YL-LIGHT-01B",type:"💡",name:"灯光B",ok:true},{code:"YL-CURTAIN-01",type:"🪟",name:"窗帘",ok:false,issue:"电机异响，电流异常",reported:true},{code:"YL-SPEAKER-01A",type:"🔊",name:"音响A",ok:true},{code:"YL-SPEAKER-01B",type:"🔊",name:"音响B",ok:true}] },
  { taskId:"CLN003", roomName:"大茶室C", status:"Pending", priority:"Normal", createdAt:"10:30", dueBy:"11:30", staff:"小芳",
    checklist:[{item:"茶台清洁",cat:"surface",done:false},{item:"地面清扫",cat:"floor",done:false},{item:"K歌设备擦拭",cat:"equipment",done:false},{item:"垃圾桶清空",cat:"waste",done:false},{item:"落地窗擦拭",cat:"glass",done:false}],
    devices:[] },
  { taskId:"CLN004", roomName:"中茶室B", status:"Completed", priority:"Normal", createdAt:"09:00", dueBy:"10:00", staff:"小芳", startedAt:"09:05", completedAt:"09:45",
    checklist:[{item:"茶台清洁",cat:"surface",done:true},{item:"地面清扫",cat:"floor",done:true},{item:"茶具清洗消毒",cat:"utensil",done:true},{item:"垃圾桶清空",cat:"waste",done:true}],
    devices:[{code:"YL-LIGHT-03A",type:"💡",name:"主灯",ok:false,issue:"面板无响应，已上报",reported:true}] },
];

// ── 列表视图 ──
function renderListView() {
  currentView = 'list';
  currentTask = null;
  document.getElementById('navTitle').textContent = '保洁任务';

  var list = tasks.filter(function(t) {
    if (currentTab === 'inprogress') return t.status === 'InProgress';
    if (currentTab === 'pending') return t.status === 'Pending';
    return t.status === 'Completed';
  });

  var html = '<div class="tab-row">' +
    '<button class="tab-item ' + (currentTab === 'inprogress' ? 'active' : '') + '" onclick="switchTab(\'inprogress\',this)">进行中</button>' +
    '<button class="tab-item ' + (currentTab === 'pending' ? 'active' : '') + '" onclick="switchTab(\'pending\',this)">待处理</button>' +
    '<button class="tab-item ' + (currentTab === 'completed' ? 'active' : '') + '" onclick="switchTab(\'completed\',this)">已完成</button></div>';

  if (!list.length) {
    html += '<div style="text-align:center;padding:40px;color:#999;"><p style="font-size:48px;">🧹</p><p>暂无任务</p></div>';
    document.getElementById('pageContent').innerHTML = html;
    return;
  }

  html += list.map(function(t) {
    var cls = t.status === 'Pending' ? 'pending' : t.status === 'InProgress' ? 'inprogress' : 'completed';
    var badgeCls = t.status === 'Pending' ? 'badge-pending' : t.status === 'InProgress' ? 'badge-progress' : 'badge-done';
    var badgeLabel = t.status === 'Pending' ? '待处理' : t.status === 'InProgress' ? '进行中' : '已完成';
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var dueParts = t.dueBy.split(':').map(Number);
    var dueMin = dueParts[0] * 60 + dueParts[1];
    var isOverdue = t.status === 'Pending' && nowMin > dueMin;

    return '<div class="task-card ' + cls + '" onclick="showDetail(\'' + t.taskId + '\')">' +
      '<div class="task-card-left">' +
      '<div class="task-card-room">' + t.roomName + ' <span class="task-card-badge ' + badgeCls + '">' + badgeLabel + '</span></div>' +
      '<div class="task-card-meta">' +
      '<span>截止 ' + t.dueBy + '</span>' +
      (isOverdue ? '<span style="color:#d54941;">⚠ 已超时</span>' : '') +
      (t.startedAt ? '<span>开始 ' + t.startedAt + '</span>' : '') +
      '</div></div><span class="task-card-arrow">›</span></div>';
  }).join('');
  document.getElementById('pageContent').innerHTML = html;
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  renderListView();
}

// ── 详情视图 ──
function showDetail(taskId) {
  var task = null;
  tasks.forEach(function(t) { if (t.taskId === taskId) task = t; });
  if (!task) return;
  currentView = 'detail';
  currentTask = task;
  document.getElementById('navTitle').textContent = '保洁详情';

  var statusLabel = task.status === 'Pending' ? '待处理' : task.status === 'InProgress' ? '进行中' : '已完成';
  var statusCls = task.status === 'Pending' ? 'badge-pending' : task.status === 'InProgress' ? 'badge-progress' : 'badge-done';

  var now = new Date();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var dueParts = task.dueBy.split(':').map(Number);
  var dueMin = dueParts[0] * 60 + dueParts[1];
  var isOverdue = task.status === 'Pending' && nowMin > dueMin;

  var metaHtml = '<span>生成: ' + task.createdAt + '</span><span>截止: ' + task.dueBy + '</span><span>保洁员: ' + task.staff + '</span>' +
    (isOverdue ? '<br><span class="urgent">⚠ 已超时</span>' : '') +
    (task.startedAt ? '<br><span>开始: ' + task.startedAt + '</span>' : '') +
    (task.completedAt ? '<span>完成: ' + task.completedAt + '</span>' : '') +
    (task.remaining !== undefined ? '<br><span class="urgent">剩余: ' + task.remaining + '分钟</span>' : '');

  var checklistHtml = task.checklist.map(function(c, i) {
    return '<div class="checklist-item" onclick="' + (task.status === 'InProgress' ? 'toggleCheckItem(' + i + ')' : '') + '">' +
      '<div class="checklist-check ' + (c.done ? 'done' : '') + '">' + (c.done ? '✓' : '') + '</div>' +
      '<span class="checklist-label ' + (c.done ? 'done' : '') + '">' + c.item + '</span></div>';
  }).join('');

  var actionsHtml = '';
  var allDone = task.checklist.every(function(c) { return c.done; });
  if (task.status === 'Pending') {
    actionsHtml = '<button class="action-btn start" onclick="startTask()">开始保洁</button>';
  } else if (task.status === 'InProgress') {
    actionsHtml = '<button class="action-btn complete" onclick="tryComplete()" ' + (allDone ? '' : 'disabled') + '>✓ 确认保洁完成</button>' +
      '<div class="action-btn-hint">' + (allDone ? '所有检查项已完成' : '请完成所有检查项后提交') + '</div>';
  }

  document.getElementById('pageContent').innerHTML =
    '<div class="detail-section">' +
    '<div class="detail-room">' + task.roomName + ' <span class="task-card-badge ' + statusCls + '">' + statusLabel + '</span></div>' +
    '<div class="detail-meta">' + metaHtml + '</div></div>' +
    '<div class="detail-section"><div class="section-title">🧹 保洁检查清单</div>' + checklistHtml + '</div>' +
    (actionsHtml ? '<div>' + actionsHtml + '</div>' : '');
}

function toggleCheckItem(idx) {
  if (!currentTask || currentTask.status !== 'InProgress') return;
  currentTask.checklist[idx].done = !currentTask.checklist[idx].done;
  showDetail(currentTask.taskId);
}

function startTask() {
  if (!currentTask) return;
  currentTask.status = 'InProgress';
  currentTask.startedAt = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  currentTask.remaining = 30;
  showDetail(currentTask.taskId);
  showToast('保洁任务已开始');
}

function tryComplete() {
  if (!currentTask || !currentTask.checklist.every(function(c) { return c.done; })) { showToast('请完成所有检查项'); return; }
  pendingComplete = currentTask.taskId;
  document.getElementById('completeMsg').textContent = currentTask.roomName + ' 确认完成保洁？';
  document.getElementById('completeModal').style.display = 'flex';
}

function doComplete() {
  if (!pendingComplete) return;
  tasks.forEach(function(t) { if (t.taskId === pendingComplete) { t.status = 'Completed'; t.completedAt = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); } });
  hideModal();
  showToast('保洁已完成！');
  showListView();
}

function handleBack() {
  if (currentTask) {
    showListView();
  } else {
    history.back();
  }
}

function showListView() {
  renderListView();
}

function hideModal() { document.getElementById('completeModal').style.display = 'none'; pendingComplete = null; }

renderListView();
</script>
</body>
</html>
