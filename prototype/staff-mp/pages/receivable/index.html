<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应收概况 - 店员端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; display:flex; justify-content:center; padding:20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.phone { width:375px; height:812px; background:#f5f7fa; border-radius:20px; overflow:hidden; box-shadow:0 4px 24px rgba(0,0,0,.12); display:flex; flex-direction:column; position:relative; }
.nav-top { position:fixed; top:10px; right:20px; z-index:200; }
.nav-top a { font-size:12px; color:#666; text-decoration:none; background:rgba(255,255,255,.95); padding:6px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.nav-bar { display:flex; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #f0f0f0; }
.back-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; }
.nav-title { flex:1; text-align:center; font-size:16px; font-weight:600; margin-right:28px; }
.page { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding:16px; padding-bottom:60px; }
.page::-webkit-scrollbar { display:none; }
.summary-card { background:linear-gradient(135deg,#0052d9,#366ef4); border-radius:14px; padding:18px; color:#fff; margin-bottom:16px; }
.summary-label { font-size:12px; opacity:.8; }
.summary-amount { font-size:28px; font-weight:800; margin-top:4px; }
.summary-sub { font-size:12px; opacity:.8; margin-top:4px; }
.summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
.summary-grid-item { background:#fff; border-radius:12px; padding:14px 8px; text-align:center; }
.summary-grid-num { font-size:20px; font-weight:800; color:#1a1a1a; }
.summary-grid-label { font-size:11px; color:#999; margin-top:2px; }
.section-title { font-size:14px; font-weight:600; color:#333; margin-bottom:10px; }
.bill-item { background:#fff; border-radius:12px; padding:14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.bill-item-left .bill-room { font-size:14px; font-weight:600; color:#333; }
.bill-item-left .bill-info { font-size:11px; color:#999; margin-top:2px; }
.bill-item-right { text-align:right; }
.bill-item-right .bill-amount { font-size:16px; font-weight:700; color:#1a1a1a; }
.bill-item-right .bill-status { font-size:11px; padding:2px 8px; border-radius:8px; font-weight:500; display:inline-block; margin-top:2px; }
.bill-status.paid { background:#e8f5e9; color:#00a870; }
.bill-status.unpaid { background:#fff3e0; color:#e37318; }
.bottom-nav { display:flex; border-top:1px solid #eee; background:#fff; flex-shrink:0; }
.nav-item { flex:1; text-align:center; padding:10px 0 6px; cursor:pointer; color:#999; }
.nav-item.active { color:#0052d9; }
.nav-item .nav-icon { font-size:20px; }
.nav-item .nav-label { font-size:10px; margin-top:2px; }
</style>
<script src="../../js/sdk.js"></script>
</head>
<body>
<div class="nav-top"><a href="../../../index.html">返回导航</a></div>
<div class="phone">
  <div class="nav-bar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="nav-title">应收概况</span>
    <span style="width:28px;"></span>
  </div>
  <div class="page">
    <div class="summary-card">
      <div class="summary-label">今日应收</div>
      <div class="summary-amount" id="todayRevenue">¥0</div>
      <div class="summary-sub" id="todaySub">加载中...</div>
    </div>
    <div class="summary-grid">
      <div class="summary-grid-item"><div class="summary-grid-num" id="totalOrders">0</div><div class="summary-grid-label">总单数</div></div>
      <div class="summary-grid-item"><div class="summary-grid-num" id="paidOrders">0</div><div class="summary-grid-label">已收款</div></div>
      <div class="summary-grid-item"><div class="summary-grid-num" id="unpaidOrders">0</div><div class="summary-grid-label">未收款</div></div>
    </div>
    <div class="section-title">今日账单</div>
    <div id="billList"></div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item" onclick="location.href='../dashboard/index.html'"><div class="nav-icon">📊</div><div class="nav-label">工作台</div></div>
    <div class="nav-item" onclick="location.href='../order-management/index.html'"><div class="nav-icon">📋</div><div class="nav-label">订单</div></div>
    <div class="nav-item" onclick="location.href='../device-monitor/index.html'"><div class="nav-icon">📱</div><div class="nav-label">设备</div></div>
    <div class="nav-item" onclick="location.href='../cleaning-task/index.html'"><div class="nav-icon">🧹</div><div class="nav-label">保洁</div></div>
  </div>
</div>
<script>
var showToast = StaffSDK.UI.toast;

function loadData() {
  var today = StaffSDK.Utils.todayStr();
  var bookings = StaffSDK.Utils.lsGet('bookings', []);
  var todayOrders = bookings.filter(function(b) { return b.created && b.created.indexOf(today) === 0; });
  var roomNames = {};
  StaffSDK.API.getRooms().then(function(rooms) {
    rooms.forEach(function(r) { roomNames[r.roomId] = r.name; });
  }).then(function() {
    var revenue = 0, paid = 0, unpaid = 0;
    todayOrders.forEach(function(o) { revenue += (o.amount || 0); });
    // 简单区分已付/未付
    todayOrders.forEach(function(o) {
      if (o.paymentStatus === 'paid' || o.status === 'Completed') paid += (o.amount || 0);
      else unpaid += (o.amount || 0);
    });

    document.getElementById('todayRevenue').textContent = StaffSDK.Utils.formatMoney(revenue);
    document.getElementById('todaySub').textContent = '共 ' + todayOrders.length + ' 笔';
    document.getElementById('totalOrders').textContent = todayOrders.length;
    document.getElementById('paidOrders').textContent = '¥' + paid;
    document.getElementById('unpaidOrders').textContent = '¥' + unpaid;

    var container = document.getElementById('billList');
    if (!todayOrders.length) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">暂无今日账单</div>';
      return;
    }
    container.innerHTML = todayOrders.map(function(o) {
      var isPaid = o.paymentStatus === 'paid' || o.status === 'Completed';
      return '<div class="bill-item">' +
        '<div class="bill-item-left"><div class="bill-room">' + (roomNames[o.roomId] || o.roomName || o.roomId) + '</div>' +
        '<div class="bill-info">' + (o.startTime||'').slice(0,5) + '-' + (o.endTime||'').slice(0,5) + ' · ' + (o.customerName || '—') + '</div></div>' +
        '<div class="bill-item-right"><div class="bill-amount">' + StaffSDK.Utils.formatMoney(o.amount) + '</div>' +
        '<span class="bill-status ' + (isPaid ? 'paid' : 'unpaid') + '">' + (isPaid ? '已收款' : '未收款') + '</span></div></div>';
    }).join('');
  });
}

loadData();
</script>
</body>
</html>
