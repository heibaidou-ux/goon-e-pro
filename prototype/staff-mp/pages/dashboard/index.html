<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 - 店员端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.phone { width:100%; max-width:100%; min-height:100vh; background:#f5f7fa; display:flex; flex-direction:column; position:relative; }
.phone ::-webkit-scrollbar { display:none; }
.phone { -ms-overflow-style:none; scrollbar-width:none; }
.nav-top { position:fixed; top:10px; right:20px; z-index:200; }
.nav-top a { font-size:12px; color:#666; text-decoration:none; background:rgba(255,255,255,.95); padding:6px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.header { background:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #f0f0f0; }
.header-store { font-size:16px; font-weight:700; }
.header-right { display:flex; align-items:center; gap:10px; }
.alert-badge { position:relative; font-size:18px; cursor:pointer; }
.alert-count { position:absolute; top:-4px; right:-6px; background:#d54941; color:#fff; font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.page { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding:16px; padding-bottom:60px; }

/* 房态总览卡片 (第一行) */
.room-overview { background:#fff; border-radius:16px; padding:16px; margin-bottom:14px; cursor:pointer; text-decoration:none; display:block; box-shadow:0 2px 8px rgba(0,0,0,.04); transition:transform .15s; }
.room-overview:active { transform:scale(.98); }
.room-ov-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.room-ov-title { font-size:15px; font-weight:700; color:#1a1a1a; }
.room-ov-arrow { font-size:13px; color:#0052d9; font-weight:500; }
.room-ov-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.room-ov-item { text-align:center; padding:10px 4px; border-radius:10px; }
.room-ov-item .rov-num { font-size:28px; font-weight:800; }
.room-ov-item .rov-label { font-size:11px; margin-top:2px; }
.rov-idle { background:#f0fdf4; }
.rov-idle .rov-num { color:#00a870; }
.rov-idle .rov-label { color:#4ade80; }
.rov-inuse { background:#eff6ff; }
.rov-inuse .rov-num { color:#0052d9; }
.rov-inuse .rov-label { color:#60a5fa; }
.rov-booked { background:#faf5ff; }
.rov-booked .rov-num { color:#9c27b0; }
.rov-booked .rov-label { color:#c084fc; }
.rov-cleaning { background:#fff7ed; }
.rov-cleaning .rov-num { color:#e37318; }
.rov-cleaning .rov-label { color:#fb923c; }
.rov-maintenance { background:#fef2f2; }
.rov-maintenance .rov-num { color:#d54941; }
.rov-maintenance .rov-label { color:#f87171; }

/* 四宫格统计 */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }
.stat-item { background:#fff; border-radius:12px; padding:14px 6px; text-align:center; cursor:pointer; transition:all .15s; text-decoration:none; }
.stat-item:active { transform:scale(.96); }
.stat-icon { font-size:22px; margin-bottom:2px; }
.stat-value { font-size:18px; font-weight:800; color:#1a1a1a; }
.stat-label { font-size:10px; color:#999; margin-top:2px; }

/* 快捷操作 - 三列两行 */
.action-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
.action-item { background:#fff; border-radius:12px; padding:16px 4px; text-align:center; cursor:pointer; transition:all .15s; border:1px solid #f0f0f0; text-decoration:none; }
.action-item:active { transform:scale(.96); border-color:#0052d9; background:#f0f5ff; }
.action-icon { font-size:24px; margin-bottom:4px; }
.action-label { font-size:12px; color:#333; font-weight:500; }
.action-sub { font-size:10px; color:#999; margin-top:2px; }

/* 待办事项 */
.todo-section { background:#fff; border-radius:14px; padding:14px; margin-bottom:16px; }
.section-title { font-size:14px; font-weight:600; color:#333; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
.section-title a { font-size:12px; color:#0052d9; text-decoration:none; font-weight:400; }
.todo-item { display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #f5f5f5; cursor:pointer; }
.todo-item:last-child { border-bottom:none; }
.todo-dot { width:8px; height:8px; border-radius:50%; margin-right:10px; flex-shrink:0; }
.todo-dot.red { background:#d54941; }
.todo-dot.yellow { background:#e37318; }
.todo-dot.gray { background:#ccc; }
.todo-dot.blue { background:#0052d9; }
.todo-text { flex:1; font-size:13px; color:#333; }
.todo-count { font-size:12px; color:#999; }
.todo-arrow { color:#ccc; font-size:14px; margin-left:6px; }

.bottom-nav { display:flex; border-top:1px solid #eee; background:#fff; flex-shrink:0; }
.nav-item { flex:1; text-align:center; padding:10px 0 6px; cursor:pointer; color:#999; }
.nav-item.active { color:#0052d9; }
.nav-item .nav-icon { font-size:20px; }
.nav-item .nav-label { font-size:10px; margin-top:2px; }

/* 验券弹窗 */
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:999; display:none; align-items:center; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:#fff; border-radius:16px; padding:24px; width:320px; max-height:80vh; overflow-y:auto; scrollbar-width:none; }
.modal::-webkit-scrollbar { display:none; }
.modal h3 { font-size:16px; font-weight:700; color:#1a1a1a; margin-bottom:4px; }
.modal .modal-desc { font-size:12px; color:#999; margin-bottom:16px; }
.modal-input { width:100%; padding:14px; border:1.5px solid #e5e5e5; border-radius:10px; font-size:20px; letter-spacing:4px; text-align:center; outline:none; transition:border-color .2s; }
.modal-input:focus { border-color:#0052d9; }
.modal-btn { width:100%; padding:14px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; margin-top:10px; transition:opacity .15s; }
.modal-btn:active { opacity:.8; }
.modal-btn.primary { background:#0052d9; color:#fff; }
.modal-btn.primary:disabled { background:#ccc; cursor:not-allowed; }
.modal-btn.secondary { background:#f5f5f5; color:#666; }
.modal-result { margin-top:12px; padding:12px; border-radius:8px; display:none; }
.modal-result.success { display:block; background:#e8f5e9; color:#00a870; }
.modal-result.error { display:block; background:#ffebee; color:#d54941; }
.modal-result .result-extra { margin-top:10px; padding-top:10px; border-top:1px solid rgba(0,0,0,.08); font-size:13px; color:#333; }
.modal-result .result-extra-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.modal-result .result-extra-row label { font-size:11px; color:#666; min-width:56px; white-space:nowrap; }
.modal-result .result-extra-row select,
.modal-result .result-extra-row input { flex:1; padding:6px 8px; border:1px solid #ddd; border-radius:6px; font-size:12px; background:#fff; }
.modal-result .result-extra-row input { min-width:0; }
.result-confirm-btn { display:block; width:100%; padding:8px; margin-top:8px; border-radius:8px; border:none; background:#0052d9; color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
.result-confirm-btn:active { opacity:.8; }
.modal-test-codes { margin-top:12px; padding:12px; background:#f9f9f9; border-radius:8px; }
.modal-test-codes-title { font-size:11px; color:#999; margin-bottom:6px; }
.modal-test-code { display:inline-block; padding:4px 10px; border-radius:6px; background:#e3f2fd; color:#0052d9; font-size:11px; margin:2px; cursor:pointer; border:none; }
.modal-test-code:active { opacity:.7; }

/* 客服呼叫弹窗 */
.service-alert-overlay { position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:9999;display:none;align-items:center;justify-content:center; }
.service-alert-overlay.active { display:flex; }
.service-alert { background:#fff;border-radius:20px;padding:30px 24px;width:320px;text-align:center;animation:sa-pop .3s ease; }
@keyframes sa-pop { 0%{transform:scale(.8);opacity:0} 100%{transform:scale(1);opacity:1} }
.service-alert .sa-icon { font-size:64px;margin-bottom:12px; }
.service-alert .sa-title { font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:4px; }
.service-alert .sa-room { font-size:15px;color:#0052d9;font-weight:600;margin-bottom:4px; }
.service-alert .sa-time { font-size:12px;color:#999;margin-bottom:20px; }
.service-alert .sa-btns { display:flex;gap:10px; }
.service-alert .sa-btn { flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none; }
.service-alert .sa-btn.primary { background:#0052d9;color:#fff; }
.service-alert .sa-btn.primary:active { opacity:.8; }
.service-alert .sa-btn.ghost { background:#f5f5f5;color:#666; }
.srv-badge { position:absolute; top:-4px; right:-4px; background:#d54941; color:#fff; font-size:10px; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; animation:srv-pulse 1.5s infinite; }
@keyframes srv-pulse { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }

.coupon-input-wrap { position:relative; width:100%; }
.coupon-input-wrap .modal-input { padding-right:44px; }
.scan-inner-btn { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:38px; height:38px; border:none; background:transparent; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; border-radius:8px; transition:background .15s; }
.scan-inner-btn:active { background:#f0f0f0; }
.scan-inner-btn.active { color:#e37318; }
.scanner-container { margin-top:10px; border-radius:10px; overflow:hidden; background:#000; position:relative; }
.scanner-container #scannerView { width:100%; min-height:160px; }
.scanner-tip { text-align:center; font-size:11px; color:#999; padding:6px; }
</style>
<script src="../../js/sdk.js"></script>
</head>
<body>
<div class="nav-top"><a href="../../../index.html">返回导航</a></div>
<div class="phone">
  <div class="header">
    <span class="header-store">高岸茶室·盈隆店</span>
    <div class="header-right">
      <div class="alert-badge" id="serviceBell" onclick="showServiceCalls()" style="display:none;">📞<span class="srv-badge" id="srvCount">0</span></div>
      <div class="alert-badge" onclick="location.href='../device-monitor/index.html'">🔔<span class="alert-count">0</span></div>
      <span style="font-size:12px;color:#0052d9;cursor:pointer;text-decoration:underline;" id="staffInfo" onclick="location.href='../profile/index.html'">店员</span>
      <span style="font-size:11px;color:#999;cursor:pointer;padding:2px 6px;border-radius:4px;" onclick="doLogout()" id="logoutBtn" title="退出登录">退出</span>
    </div>
  </div>
  <div class="page" id="pageContainer">

    <!-- 实时房态总览 (第一行，整体放大) -->
    <a class="room-overview" href="../room-status/index.html">
      <div class="room-ov-header">
        <span class="room-ov-title">🏠 实时房态</span>
        <span class="room-ov-arrow">查看详情 →</span>
      </div>
      <div class="room-ov-grid">
        <div class="room-ov-item rov-idle"><div class="rov-num" id="rvIdle">0</div><div class="rov-label">空闲</div></div>
        <div class="room-ov-item rov-inuse"><div class="rov-num" id="rvInUse">0</div><div class="rov-label">使用中</div></div>

    <!-- 四宫格统计 -->
    <div class="stats-grid" id="statsGrid">
      <a class="stat-item" href="../receivable/index.html">
        <div class="stat-icon">💰</div>
        <div class="stat-value" id="statRevenue">¥0</div>
        <div class="stat-label">今日营收</div>
      </a>
      <a class="stat-item" href="../todo/index.html">
        <div class="stat-icon">📋</div>
        <div class="stat-value" id="statTodo">0</div>
        <div class="stat-label">待办</div>
      </a>
      <a class="stat-item" href="../order-management/index.html">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="statOrders">0</div>
        <div class="stat-label">订单</div>
      </a>
      <a class="stat-item" href="../device-monitor/index.html">
        <div class="stat-icon">🔔</div>
        <div class="stat-value" id="statAlerts">0</div>
        <div class="stat-label">告警</div>
      </a>
    </div>

    <!-- 快捷操作 (三列) -->
    <div class="action-grid">
      <div class="action-item" onclick="openCouponModal()">
        <div class="action-icon">🎫</div>
        <div class="action-label">验券</div>
      </div>
      <a class="action-item" href="../attendance/index.html">
        <div class="action-icon">⏰</div>
        <div class="action-label">考勤打卡</div>
      </a>
      <a class="action-item" href="../product-management/index.html">
        <div class="action-icon">📦</div>
        <div class="action-label">商品管理</div>
      </a>
      <a class="action-item" href="../reconciliation/index.html">

      <a class="action-item" href="../inspection/index.html">

        <div class="action-label">门店巡检</div>
        <div class="action-sub" id="inspecSub">含安排任务</div>
      </a>
      <a class="action-item" href="../scheduling/index.html">
        <div class="action-icon">📅</div>
        <div class="action-label">排班管理</div>
        <div class="action-sub">店长</div>
      </a>
    </div>

    <!-- 待办事项 -->
    <div class="todo-section">
      <div class="section-title">
        <span>待办事项</span>
        <a href="../cleaning-task/index.html">查看全部 →</a>
      </div>
      <div class="todo-item" onclick="location.href='../cleaning-task/index.html'">
        <div class="todo-dot red"></div><span class="todo-text">保洁任务</span><span class="todo-count" id="todoCleaning">0间待处理</span><span class="todo-arrow">›</span>
      </div>
      <div class="todo-item" onclick="location.href='../reconciliation/index.html'">
        <div class="todo-dot red"></div><span class="todo-text">对账工单</span><span class="todo-count" id="todoRecon">0笔差异</span><span class="todo-arrow">›</span>
      </div>
      <div class="todo-item" onclick="location.href='../device-monitor/index.html'">
        <div class="todo-dot yellow"></div><span class="todo-text">设备告警</span><span class="todo-count" id="todoAlerts">0个告警</span><span class="todo-arrow">›</span>
      </div>
      <div class="todo-item" onclick="location.href='../inspection/index.html'">
        <div class="todo-dot gray"></div><span class="todo-text">巡检任务</span><span class="todo-count">下午开始</span><span class="todo-arrow">›</span>
      </div>
      <div class="todo-item" onclick="location.href='../reconciliation/index.html'">
        <div class="todo-dot blue"></div><span class="todo-text">待抽查操作</span><span class="todo-count" id="todoAudit">0条待审核</span><span class="todo-arrow">›</span>

  <div class="bottom-nav">

<div class="service-alert-overlay" id="serviceAlertOverlay">

    <div class="sa-icon">📞</div>
    <div class="sa-title">客人呼叫服务</div>
    <div class="sa-room" id="saRoom">大茶室C</div>
    <div class="sa-time" id="saTime">刚刚</div>
    <div class="sa-btns">
      <button class="sa-btn ghost" onclick="closeServiceAlert()">稍后处理</button>
      <button class="sa-btn primary" onclick="acceptServiceCall()">✓ 我知道了</button>
    </div>
  </div>
</div>

<!-- 验券弹窗 -->
<div class="modal-overlay" id="couponModal">
  <div class="modal">
    <h3>🎫 验券</h3>
    <div class="modal-desc">输入券码或扫码核销</div>
    <div class="coupon-input-wrap">
      <input class="modal-input" id="couponInput" type="text" placeholder="输入券码" maxlength="20" autocomplete="off" oninput="onCouponInput()">
      <button class="scan-inner-btn" id="scanBtn" onclick="toggleScanner()" title="扫码">🔲</button>
    </div>
    <div class="scanner-container" id="scannerContainer" style="display:none;">
      <div id="scannerView"></div>
      <div class="scanner-tip">将券码二维码对准扫码框</div>
    </div>
    <button class="modal-btn primary" id="couponVerifyBtn" onclick="verifyCoupon()" disabled>核销</button>
    <div class="modal-result" id="couponResult"></div>
    <div class="modal-test-codes">
      <div class="modal-test-codes-title">测试券码（点击填入）</div>
      <button class="modal-test-code" onclick="fillCoupon('MT20260501')">MT20260501</button>
      <button class="modal-test-code" onclick="fillCoupon('DY20260501')">DY20260501</button>
      <button class="modal-test-code" onclick="fillCoupon('DP20260501')">DP20260501</button>
      <button class="modal-test-code" onclick="fillCoupon('MT20260503')">MT20260503</button>
      <button class="modal-test-code" onclick="fillCoupon('SY20260501')">SY20260501</button>
    </div>
    <button class="modal-btn secondary" onclick="closeCouponModal()" style="margin-top:8px;">关闭</button>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
var showToast = StaffSDK.UI.toast;
var html5QrCode = null;
var scannerRunning = false;

// 设置店员信息
StaffSDK.API.getCurrentStaff().then(function(staff) {
  if (staff) document.getElementById('staffInfo').textContent = staff.role + ': ' + staff.name;
});

// 加载统计数据
StaffSDK.API.getTodayStats().then(function(stats) {
  if (!stats) return;
  document.getElementById('statRevenue').textContent = StaffSDK.Utils.formatMoney(stats.revenue);
  document.getElementById('statOrders').textContent = stats.orderCount;
  document.getElementById('statAlerts').textContent = stats.alerts;

  var totalTodo = (stats.pendingCleaning || 0) + (stats.pendingReconciliation || 0) + (stats.pendingAudit || 0);
  document.getElementById('statTodo').textContent = totalTodo;

  var alertBadge = document.querySelector('.alert-count');
  if (alertBadge) alertBadge.textContent = stats.alerts;

  document.getElementById('todoCleaning').textContent = (stats.pendingCleaning || 0) + '间待处理';
  document.getElementById('todoRecon').textContent = (stats.pendingReconciliation || 0) + '笔差异';
  document.getElementById('todoAlerts').textContent = (stats.alerts || 0) + '个告警';
  document.getElementById('todoAudit').textContent = (stats.pendingAudit || 0) + '条待审核';
});

// 房态总览数据
(function() {
  var statuses = StaffSDK.API.getAllRoomStatus();
  var idle = 0, inuse = 0, booked = 0, cleaning = 0, maint = 0;
  statuses.forEach(function(r) {
    if (r.roomId === 'RM005' || r.roomId === 'RM006') return;
    if (r.status === 'Active' || r.status === 'Idle') idle++;
    else if (r.status === 'InUse') inuse++;
    else if (r.status === 'Booked') booked++;
    else if (r.status === 'Cleaning') cleaning++;
    else if (r.status === 'Maintenance') maint++;
  });
  document.getElementById('rvIdle').textContent = idle;
  document.getElementById('rvInUse').textContent = inuse;
  document.getElementById('rvBooked').textContent = booked;
  document.getElementById('rvCleaning').textContent = cleaning;
  // 如果有维修中的也展示（加到待打扫后面或另加一列）
  if (maint > 0) {
    var grid = document.querySelector('.room-ov-grid');
    if (grid) {
      var item = document.createElement('div');
      item.className = 'room-ov-item rov-maintenance';
      item.innerHTML = '<div class="rov-num">' + maint + '</div><div class="rov-label">维修中</div>';
      grid.appendChild(item);
    }
  }
})();

// ── 验券 ──
function openCouponModal() {
  stopScanner();
  document.getElementById('couponModal').classList.add('active');
  document.getElementById('couponInput').value = '';
  document.getElementById('couponResult').style.display = 'none';
  document.getElementById('couponResult').className = 'modal-result';
  document.getElementById('couponVerifyBtn').disabled = true;
  document.getElementById('couponInput').focus();
}

function toggleScanner() {
  var container = document.getElementById('scannerContainer');
  if (scannerRunning) { stopScanner(); return; }
  container.style.display = 'block';
  document.getElementById('scanBtn').classList.add('active');
  scannerRunning = true;

  if (!html5QrCode) {
    html5QrCode = new Html5Qrcode("scannerView");
  }
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 200, height: 200 } },
    function(qrMessage) {
      document.getElementById('couponInput').value = qrMessage;
      document.getElementById('couponVerifyBtn').disabled = false;
      showToast('✅ 扫码成功');
      stopScanner();
    }
  ).catch(function(err) {
    showToast('启动摄像头失败: ' + err.message);
    stopScanner();
  });
}

function stopScanner() {
  if (html5QrCode && scannerRunning) {
    try { html5QrCode.stop(); } catch(e) {}
  }
  scannerRunning = false;
  document.getElementById('scannerContainer').style.display = 'none';
  document.getElementById('scanBtn').classList.remove('active');
}

function closeCouponModal() {
  stopScanner();
  document.getElementById('couponModal').classList.remove('active');
}

function onCouponInput() {
  var val = document.getElementById('couponInput').value.trim();
  document.getElementById('couponVerifyBtn').disabled = !val;
}

function fillCoupon(code) {
  document.getElementById('couponInput').value = code;
  document.getElementById('couponVerifyBtn').disabled = false;
  document.getElementById('couponInput').focus();
}

function verifyCoupon() {
  var code = document.getElementById('couponInput').value.trim();
  if (!code) return;
  var btn = document.getElementById('couponVerifyBtn');
  var result = document.getElementById('couponResult');

  btn.disabled = true;
  btn.textContent = '验证中...';
  result.style.display = 'none';

  StaffSDK.API.verifyCoupon(code).then(function(data) {
    return StaffSDK.API.useCoupon(code).then(function() {
      var rooms = StaffSDK.API.getAllRoomStatus();
      var roomOpts = '<option value="">选择房间（选填）</option>';
      rooms.forEach(function(r) {
        if (r.bookable) roomOpts += '<option value="' + r.roomId + '">' + r.name + ' [' + StaffSDK.Utils.getRoomStatusBadge(r.status) + ']</option>';
      });
      var channelOpts = '<option value="">选择渠道</option><option value="美团">美团</option><option value="抖音">抖音</option><option value="大众点评">大众点评</option><option value="线下">线下</option><option value="其他">其他</option>';

      result.className = 'modal-result success';
      result.innerHTML = '✅ 核销成功<br><strong>' + data.coupon.desc + '</strong><br>价值: ¥' + data.coupon.value +
        '<div class="result-extra">' +
        '<div class="result-extra-row"><label>房间</label><select id="extraRoom">' + roomOpts + '</select></div>' +
        '<div class="result-extra-row"><label>会员号</label><input id="extraMember" placeholder="手机号（选填）" type="tel"></div>' +
        '<div class="result-extra-row"><label>消费金额</label><input id="extraAmount" placeholder="实际消费金额" type="number"></div>' +
        '<div class="result-extra-row"><label>渠道</label><select id="extraChannel">' + channelOpts + '</select></div>' +
        '<button class="result-confirm-btn" onclick="confirmCouponExtra()">✓ 确认核销</button></div>';
      result.style.display = 'block';
      btn.textContent = '✓ 已核销';
      window._couponData = data;
    });
  }).catch(function(err) {
    result.className = 'modal-result error';
    result.textContent = '❌ ' + (err.message || '验证失败');
    result.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '核销';
  });
}

function confirmCouponExtra() {
  var room = document.getElementById('extraRoom').value;
  var member = document.getElementById('extraMember').value.trim();
  var amount = document.getElementById('extraAmount').value;
  var channel = document.getElementById('extraChannel').value;
  var data = window._couponData;

  var log = {
    type: 'coupon_verify',
    code: data ? data.code : '',
    desc: data ? data.coupon.desc : '',
    value: data ? data.coupon.value : 0,
    roomId: room || null,
    memberPhone: member || null,
    amount: amount ? parseFloat(amount) : 0,
    channel: channel || null,
    staffName: (document.getElementById('staffInfo').textContent || '').replace(/.*?: /, ''),
    time: new Date().toISOString()
  };
  var logs = StaffSDK.Utils.lsGet('coupon_logs', []);
  logs.push(log);
  StaffSDK.Utils.lsSet('coupon_logs', logs);

  StaffSDK.UI.toast('核销记录已保存');
  var extra = document.querySelector('.result-extra');
  if (extra) {
    extra.innerHTML = '<div style="font-size:12px;color:#00a870;">✔ 已记录' +
      (room ? ' · 房间: ' + room : '') +
      (member ? ' · 会员: ' + member : '') +
      (amount ? ' · ¥' + amount : '') +
      (channel ? ' · ' + channel : '') +
      '</div>';
  }
}

document.getElementById('couponModal').addEventListener('click', function(e) {
  if (e.target === this) closeCouponModal();
});

function doLogout() {
  StaffSDK.UI.confirm('退出登录', '确定退出当前账号吗？').then(function(ok) {
    if (!ok) return;
    StaffSDK.API.staffLogout().then(function() {
      location.href = '../login/index.html';
    });
  });
}

// ── 客服呼叫监听 ──
var lastServiceIdx = 0;
function pollServiceCalls() {
  try {
    var notifs = JSON.parse(localStorage.getItem('mp_staff_notifications') || '[]');
    if (notifs.length > lastServiceIdx) {
      // New calls detected
      var newest = notifs[0];
      if (newest && newest.type === 'customer_call') {
        document.getElementById('saRoom').textContent = newest.roomName || '—';
        document.getElementById('saTime').textContent = newest.time || '刚刚';
        document.getElementById('serviceAlertOverlay').classList.add('active');
        document.getElementById('serviceBell').style.display = 'inline-block';
        document.getElementById('srvCount').textContent = notifs.length;
        // Play sound notification
        try { var ctx = new (window.AudioContext || window.webkitAudioContext)(); var osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime); osc.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3); } catch(e) {}
      }
    }
  } catch(e) {}
}
function closeServiceAlert() { document.getElementById('serviceAlertOverlay').classList.remove('active'); }
function acceptServiceCall() {
  lastServiceIdx = JSON.parse(localStorage.getItem('mp_staff_notifications') || '[]').length;
  document.getElementById('serviceAlertOverlay').classList.remove('active');
  document.getElementById('serviceBell').style.display = 'none';
  showToast('已确认，将安排员工前往');
}
// Poll every 3 seconds
setInterval(pollServiceCalls, 3000);
</script>
</body>
