<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- ROUTER -->
  <rect x="350" y="10" width="200" height="50" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="450" y="41" text-anchor="middle" fill="#333" font-weight="bold">光猫/软路由</text>

  <!-- SWITCH -->
  <rect x="300" y="110" width="300" height="50" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="450" y="141" text-anchor="middle" fill="#333" font-weight="bold">24口千兆网管交换机（工作间机柜 1U）</text>

  <!-- VLAN 10 -->
  <rect x="100" y="230" width="250" height="50" rx="8" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="225" y="261" text-anchor="middle" fill="#2c3e50" font-weight="bold">VLAN 10 · 智能内网（端口1-8）</text>

  <!-- VLAN 20 -->
  <rect x="550" y="230" width="250" height="50" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="675" y="261" text-anchor="middle" fill="#d35400" font-weight="bold">VLAN 20 · 客人外网（端口9-20）</text>

  <!-- HA -->
  <rect x="50" y="360" width="300" height="60" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="200" y="386" text-anchor="middle" fill="#333" font-weight="bold">HA主机</text>
  <text x="200" y="406" text-anchor="middle" fill="#666" font-size="11">工作间机柜（第3U位）</text>

  <!-- T-6715 -->
  <rect x="50" y="490" width="300" height="60" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="200" y="516" text-anchor="middle" fill="#333" font-weight="bold">T-6715 × 5</text>
  <text x="200" y="536" text-anchor="middle" fill="#666" font-size="11">各房间吊顶电箱 · VLAN 10</text>

  <!-- AP -->
  <rect x="550" y="490" width="300" height="60" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
  <text x="700" y="516" text-anchor="middle" fill="#333" font-weight="bold">AP × 7</text>
  <text x="700" y="536" text-anchor="middle" fill="#666" font-size="11">86面板×5 + 吸顶×2 · VLAN 20</text>

  <!-- Arrows -->
  <line x1="450" y1="60" x2="450" y2="105" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="88" fill="#666" font-size="11">WAN</text>

  <line x1="375" y1="160" x2="225" y2="225" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="160" x2="675" y2="225" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="200" y1="280" x2="200" y2="355" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="420" x2="200" y2="485" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="700" y1="280" x2="700" y2="485" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
</svg>