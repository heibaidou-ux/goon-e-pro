<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 620" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- HA -->
  <rect x="275" y="10" width="200" height="50" rx="8" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="375" y="41" text-anchor="middle" fill="#2c3e50" font-weight="bold">HA主机（工作间机柜）</text>

  <!-- USB to 485 -->
  <rect x="250" y="120" width="250" height="50" rx="8" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="375" y="151" text-anchor="middle" fill="#2c3e50" font-weight="bold">USB转485转换器（机柜侧挂）</text>

  <!-- HUB -->
  <rect x="225" y="230" width="300" height="60" rx="8" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="375" y="258" text-anchor="middle" fill="#2c3e50" font-weight="bold">8路隔离集线器（机柜侧挂）</text>
  <text x="375" y="278" text-anchor="middle" fill="#2c3e50" font-size="11">各房间独立RVVP 4×0.5</text>

  <!-- CH1 -->
  <rect x="50" y="400" width="250" height="50" rx="8" fill="#f5f5f5" stroke="#566573" stroke-width="2"/>
  <text x="175" y="431" text-anchor="middle" fill="#333" font-weight="bold">CH1 · 大会议室</text>

  <!-- CH2 -->
  <rect x="50" y="490" width="250" height="50" rx="8" fill="#f5f5f5" stroke="#566573" stroke-width="2"/>
  <text x="175" y="521" text-anchor="middle" fill="#333" font-weight="bold">CH2 · 中茶室A</text>

  <!-- CH3 -->
  <rect x="50" y="560" width="250" height="50" rx="8" fill="#f5f5f5" stroke="#566573" stroke-width="2"/>
  <text x="175" y="591" text-anchor="middle" fill="#333" font-weight="bold">CH3 · 中茶室B</text>

  <!-- CH4 -->
  <rect x="450" y="490" width="250" height="50" rx="8" fill="#f5f5f5" stroke="#566573" stroke-width="2"/>
  <text x="575" y="521" text-anchor="middle" fill="#333" font-weight="bold">CH4 · 大茶室C</text>

  <!-- CH5 -->
  <rect x="450" y="560" width="250" height="50" rx="8" fill="#f5f5f5" stroke="#566573" stroke-width="2"/>
  <text x="575" y="591" text-anchor="middle" fill="#333" font-weight="bold">CH5 · 展厅</text>

  <!-- Arrows -->
  <line x1="375" y1="60" x2="375" y2="115" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="93" fill="#666" font-size="11">USB</text>

  <line x1="375" y1="170" x2="375" y2="225" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="203" fill="#666" font-size="11">RS485</text>

  <!-- HUB to CH1 -->
  <path d="M 225 260 L 175 260 L 175 395" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- HUB to CH2 -->
  <path d="M 225 260 L 100 260 L 100 350 L 175 350 L 175 485" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="190" y="268" fill="#666" font-size="10">红/黑=24V供电</text>
  <text x="190" y="282" fill="#666" font-size="10">黄/白=485信号</text>

  <!-- HUB to CH3 -->
  <line x1="225" y1="290" x2="175" y2="555" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HUB to CH4 -->
  <line x1="525" y1="260" x2="575" y2="485" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HUB to CH5 -->
  <line x1="525" y1="290" x2="575" y2="555" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
</svg>