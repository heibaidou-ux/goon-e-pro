<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d35400"/>
    </marker>
  </defs>

  <!-- PHONE -->
  <rect x="20" y="80" width="120" height="50" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="80" y="110" text-anchor="middle" fill="#d35400" font-weight="bold">客人手机</text>

  <!-- BT -->
  <rect x="20" y="200" width="180" height="70" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="110" y="226" text-anchor="middle" fill="#d35400" font-weight="bold">蓝牙音频模块（隐藏）</text>
  <text x="110" y="244" text-anchor="middle" fill="#d35400" font-size="11">吊顶电箱内</text>
  <text x="110" y="260" text-anchor="middle" fill="#d35400" font-size="11">DC供电由继电器CH5控制</text>

  <!-- HA -->
  <rect x="300" y="10" width="140" height="50" rx="8" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="370" y="41" text-anchor="middle" fill="#2c3e50" font-weight="bold">HA主机</text>

  <!-- T-6715 -->
  <rect x="550" y="120" width="160" height="60" rx="8" fill="#d4e6f1" stroke="#2c3e50" stroke-width="2"/>
  <text x="630" y="148" text-anchor="middle" fill="#2c3e50" font-weight="bold">T-6715</text>
  <text x="630" y="166" text-anchor="middle" fill="#2c3e50" font-size="11">（吊顶电箱）</text>

  <!-- SPEAKER -->
  <rect x="780" y="120" width="110" height="60" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2"/>
  <text x="835" y="155" text-anchor="middle" fill="#1e8449" font-weight="bold">Bose吸顶音箱</text>

  <!-- Arrows -->
  <!-- Phone --蓝牙--> BT -->
  <line x1="80" y1="130" x2="110" y2="195" stroke="#d35400" stroke-width="2" marker-end="url(#arrow-gold)"/>
  <text x="120" y="168" fill="#d35400" font-size="11">蓝牙</text>

  <!-- HA --订单状态--> BT -->
  <line x1="300" y1="35" x2="200" y2="230" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="50" fill="#666" font-size="11">订单状态 → CH5 ON/OFF</text>
  <text x="210" y="66" fill="#666" font-size="11">（控制蓝牙电源）</text>

  <!-- BT --3.5mm--> T-6715 -->
  <line x1="200" y1="235" x2="545" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="195" fill="#666" font-size="11">3.5mm短线 ≤0.5m</text>

  <!-- HA --IP推流--> T-6715 -->
  <line x1="370" y1="60" x2="630" y2="115" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="440" y="88" fill="#666" font-size="11">IP网络推流（VLAN 10）</text>

  <!-- T-6715 --> Speaker -->
  <line x1="710" y1="150" x2="775" y2="150" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="142" fill="#666" font-size="11">内置功放</text>
  <text x="740" y="132" fill="#666" font-size="11">SPK OUT（100V）</text>
</svg>